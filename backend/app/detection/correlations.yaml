# Multi-event correlations. Each evaluates the *recent alerted events of one entity*
# (group_by) and fires when the event being processed completes the pattern.
#   kind: sequence   stages (ordered in time); the current event must satisfy the LAST stage
#   kind: threshold  at least `min` distinct values of `distinct` among events satisfying `select`
# A stage/selector matches an event that has a detection whose rule id is in `rules`,
# whose tactic is in `tactics`, or whose tag is in `tags`.
version: "2026.10.1"
correlations:

- id: TB-COR-001
  name: Brute force followed by successful login from the same source
  severity: critical
  confidence: 90
  techniques: [T1110, T1078]
  group_by: source_ip
  window_minutes: 120
  kind: sequence
  stages:
    - {rules: [TB-AUTH-001, TB-AUTH-003, TB-AUTH-004]}
    - {rules: [TB-AUTH-002]}
  tests:
    - name: spray then success
      expect_fire: true
      events:
        - {source_ip: 203.0.113.9, at: 0, detections: [TB-AUTH-003]}
        - {source_ip: 203.0.113.9, at: 20, detections: [TB-AUTH-002]}
    - name: success before the attack does not count
      expect_fire: false
      events:
        - {source_ip: 203.0.113.9, at: 0, detections: [TB-AUTH-002]}
        - {source_ip: 203.0.113.9, at: 20, detections: [TB-AUTH-003]}
    - name: different source
      expect_fire: false
      events:
        - {source_ip: 203.0.113.9, at: 0, detections: [TB-AUTH-003]}
        - {source_ip: 203.0.113.77, at: 20, detections: [TB-AUTH-002]}

- id: TB-COR-002
