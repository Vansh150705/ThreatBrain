  severity: high
  confidence: 80
  techniques: [T1595, T1190]
  group_by: source_ip
  window_minutes: 240
  kind: sequence
  stages:
    - {rules: [TB-RECON-001, TB-RECON-002, TB-NET-001]}
    - {rules: [TB-WEB-001, TB-WEB-002, TB-WEB-003, TB-WEB-005, TB-WEB-006, TB-WEB-007]}
  tests:
    - name: scan then sqli
      expect_fire: true
      events:
        - {source_ip: 198.51.100.4, at: 0, detections: [TB-RECON-002]}
        - {source_ip: 198.51.100.4, at: 30, detections: [TB-WEB-003]}
    - name: sqli only
      expect_fire: false
      events:
        - {source_ip: 198.51.100.4, at: 30, detections: [TB-WEB-003]}

- id: TB-COR-003
  name: Web exploitation followed by shell or process execution on the same asset
  severity: critical
  confidence: 90
  techniques: [T1190, T1059]
  group_by: asset_name
  window_minutes: 60
  kind: sequence
  stages:
    - {rules: [TB-WEB-001, TB-WEB-002, TB-WEB-003, TB-WEB-006, TB-WEB-007, TB-WEB-008], tags: [web-attack]}
    - {rules: [TB-WEB-009, TB-EXEC-003, TB-EXEC-004, TB-EXEC-001, TB-EXEC-002, TB-C2-006], tags: [reverse-shell]}
  tests:
    - name: exploit then reverse shell
      expect_fire: true
      events:
        - {asset_name: web-01, at: 0, detections: [TB-WEB-002]}
        - {asset_name: web-01, at: 5, detections: [TB-EXEC-003]}
    - name: a rule added later is covered through its tags
      expect_fire: true
      events:
        - {asset_name: web-01, at: 0, detections: [TB-WEB-099], tags: [web-attack]}
        - {asset_name: web-01, at: 5, detections: [TB-EXEC-099], tags: [reverse-shell]}
    - name: other asset
      expect_fire: false
      events:
        - {asset_name: web-01, at: 0, detections: [TB-WEB-002]}
        - {asset_name: db-01, at: 5, detections: [TB-EXEC-003]}

