      - {field: command_line, regex: '(sed|perl)\s.{0,80}(nopasswd|%sudo|%wheel).{0,80}/etc/sudoers'}
      - {field: command_line, regex: 'usermod\s.{0,20}-a?G\s{0,3}(sudo|wheel|admin|root)\b'}
      - {field: command_line, regex: '(sed\s+-i\S{0,6}|tee\s+(-a\s+)?|>>?\s{0,3}).{0,160}/etc/sudoers(?![./\w])|sh\s+-c\s+.{0,120}(>>?\s{0,3})/etc/sudoers(?![./\w])'}
