      - {field: command_line, regex: '(stop-service|set-service|remove-service|sc(\.exe)?\s+(stop|config))\s.{0,60}(windefend|wdnissvc|sense\b|mpssvc|eventlog|sysmon\w{0,10}|wscsvc|csagent|csfalcon\w{0,8}|sentinel\w{0,10}|cbdefense|carbonblack|mbamservice|sophos\w{0,10}|wazuh\w{0,6}|auditd|ossec)'}
