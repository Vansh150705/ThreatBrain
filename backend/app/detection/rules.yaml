# =============================================================== DEFENSE EVASION
- id: TB-EVADE-001
  name: Log clearing or command-history tampering
  severity: high
  confidence: 85
  techniques: [T1070.001, T1070.002, T1070.003]
  tags: [log-clearing, defense-evasion]
  match:
    any:
      - {field: command_line, regex: 'wevtutil(\.exe)?\s+(cl|clear-log)\b'}
      - {field: command_line, regex: 'clear-eventlog|remove-eventlog'}
      - {field: command_line, regex: '(eventlogsession|eventing\.reader).{0,80}\.clearlog\s*\(|\.clearlog\s*\(\s*[''"]?(security|system|application|microsoft)|\[system\.diagnostics\.eventlog\]\s*::\s*(delete|clear)'}
      - {field: command_line, regex: '(^|[;&|\s])clear-history\b'}
      - {field: command_line, regex: 'set-psreadlineoption\s.{0,60}historysavestyle\s+savenothing|remove-item\s.{0,100}consolehost_history|ln\s+-s\w*\s+/dev/null\s+\S{0,40}\.(bash|zsh)_history|truncate\s+-s\s?0\s+\S{0,60}(/var/log/|\.log\b)|(cat\s+/dev/null|:)\s?>\s?\S{0,60}-json\.log'}
      - {field: command_line, regex: 'wevtutil(\.exe)?\s+sl\s.{0,60}(/e(nabled)?:\s?false|/ms:\s?[0-9]{1,6}\b(?!\d))|auditpol(\.exe)?\s+/(clear|remove)\b'}
      - {field: command_line, regex: 'journalctl\s.{0,60}--(vacuum-time=\s?[0-9]{1,3}\s?(s|sec|secs|seconds?|m|min|mins|minutes?)?(?![a-z0-9])|vacuum-files=\s?[0-2](?![0-9]))|rm\s+(-\w+\s+)?\S{0,30}/var/(log/journal|log/audit)'}
      - {field: command_line, regex: '(unset\s+histfile|histsize=0|histfile=/dev/null|history\s+-c|rm\s+(-\w+\s+)?\S{0,40}\.(bash|zsh)_history|(>|truncate\s+-s\s?0)\s{0,3}\S{0,40}\.(bash|zsh)_history)'}
      - {field: command_line, regex: '(shred|rm\s+(-\w+\s+)?|truncate\s+-s\s?0\s+|>\s{0,3})\s{0,3}/var/log/(auth\.log|secure|syslog|messages|wtmp|btmp|lastlog|audit/audit\.log|kern\.log)'}
      - {field: event_type, regex: '^system\.(log_cleared|audit_log_cleared)|log_cleared'}
      - {field: raw.event_code, in: ['1102', '104']}
  tests:
    - {event: {command_line: 'wevtutil cl Security'}, expect_match: true}
    - {event: {command_line: 'cat /dev/null > /var/log/auth.log'}, expect_match: true}
    - {event: {command_line: 'truncate -s 0 /var/log/auth.log'}, expect_match: true}
    - {event: {command_line: 'export HISTFILE=/dev/null'}, expect_match: true}
    - {event: {raw_data: {event_code: '1102'}}, expect_match: true}
    - {event: {command_line: 'tail -f /var/log/auth.log'}, expect_match: false}
    - {name: .NET api, event: {command_line: "powershell -c [System.Diagnostics.Eventing.Reader.EventLogSession]::GlobalSession.ClearLog('Security')"}, expect_match: true}
    - {name: channel disabled, event: {command_line: 'wevtutil sl Microsoft-Windows-Sysmon/Operational /e:false'}, expect_match: true}
    - {name: reading the log is fine, event: {command_line: 'wevtutil qe Security /c:5 /f:text'}, expect_match: false}
    - {name: log resized to zero, event: {command_line: 'wevtutil sl security /ms:0'}, expect_match: true}
    - {name: PSReadLine history disabled, event: {command_line: 'Set-PSReadlineOption -HistorySaveStyle SaveNothing'}, expect_match: true}
    - {name: container log truncated, event: {command_line: 'sudo truncate -s 0 /var/lib/docker/containers/abc/abc-json.log'}, expect_match: true}
    - {name: journald vacuumed to one second, event: {command_line: 'journalctl --vacuum-time=1s'}, expect_match: true}
    - {name: sensible journal retention is fine, event: {command_line: 'journalctl --vacuum-time=30d'}, expect_match: false}
    - {name: a 100 MB log size is fine, event: {command_line: 'wevtutil sl Application /ms:104857600'}, expect_match: false}
    - {name: listing logs is fine, event: {command_line: "powershell -c [System.Diagnostics.Eventing.Reader.EventLogSession]::GlobalSession.GetLogNames()"}, expect_match: false}

