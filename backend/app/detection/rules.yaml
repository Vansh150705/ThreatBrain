    - {event: {command_line: 'visudo -cf /etc/sudoers.d/deploy'}, expect_match: false}
    - {name: drop-in file for one user, event: {command_line: 'echo "alice ALL=(ALL) ALL" | sudo tee /etc/sudoers.d/alice'}, expect_match: false}
    - {name: weakening sudo timeouts in place, event: {command_line: "sudo sed -i 's/env_reset.*$/env_reset,timestamp_timeout=-1/' /etc/sudoers"}, expect_match: true}
