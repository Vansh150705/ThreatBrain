  tests:
    - {event: {command_line: 'reg import C:\Users\Public\d.reg'}, expect_match: true}
    - {event: {command_line: 'regedit /s C:\Windows\Temp\x.reg'}, expect_match: true}
    - {name: admin baseline, event: {command_line: 'reg import C:\ops\baselines\hardening.reg'}, expect_match: false}
    - {name: export is not import, event: {command_line: 'reg export HKLM\Software\Vendor C:\Users\Public\vendor.reg'}, expect_match: false}

- id: TB-EVADE-011
  name: Security control disabled or excluded through a registry value (host telemetry)
  severity: high
  confidence: 80
  techniques: [T1562.001, T1112]
  tags: [defense-evasion, registry, tamper, telemetry]
  tuning: Security teams and GPO write these values legitimately; exclude the managing account or process.
  match:
    any:
      - all:
          - {field: raw.target_object, regex: '(windows defender|windowsdefender|microsoft antimalware).{0,80}\\(disableantispyware|disableantivirus|disablerealtimemonitoring|disablebehaviormonitoring|disableioavprotection|disablescriptscanning|disableonaccessprotection|tamperprotection)$'}
          - {field: raw.details, regex: '(0x0*1\b|^1$|dword \(0x0*1\))'}
      - {field: raw.target_object, regex: '(windows defender|microsoft antimalware)\\exclusions\\(paths|extensions|processes)\\'}
      - all:
          - {field: raw.target_object, regex: '\\(scriptblocklogging\\enablescriptblocklogging|modulelogging\\enablemodulelogging|eventlog\\[^\\]+\\(maxsize|retention))$'}
          - {field: raw.details, regex: '(0x0*0\b|^0$|dword \(0x0*0\))'}
  tests:
    - {event: {event_type: registry.value_set, raw_data: {target_object: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\DisableAntiSpyware', details: 'DWORD (0x00000001)'}}, expect_match: true}
    - {event: {event_type: registry.value_set, raw_data: {target_object: 'HKLM\SOFTWARE\Microsoft\Windows Defender\Exclusions\Paths\C:\Users\Public', details: 'DWORD (0x00000000)'}}, expect_match: true}
    - {name: enabling protection is fine, event: {event_type: registry.value_set, raw_data: {target_object: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\DisableAntiSpyware', details: 'DWORD (0x00000000)'}}, expect_match: false}
    - {name: unrelated value, event: {event_type: registry.value_set, raw_data: {target_object: 'HKCU\Software\Vendor\Theme', details: 'dark'}}, expect_match: false}

- id: TB-EVADE-012
  name: Host firewall opened to inbound traffic without binding it to a program
  severity: medium
  confidence: 65
  techniques: [T1562.004]
  tags: [defense-evasion, firewall]
  tuning: Application installers add inbound rules; those name the program. Rules named like built-in ones are a masquerading signal.
  match:
    any:
      - all:
          - {field: command_line, regex: 'netsh(\.exe)?\s+advfirewall\s+firewall\s+add\s+rule\s.{0,120}dir=in\b.{0,120}action=allow|netsh(\.exe)?\s+advfirewall\s+firewall\s+add\s+rule\s.{0,120}action=allow.{0,120}dir=in\b'}
          - not: {field: command_line, regex: 'program="?[a-z]:\\'}
      - {field: command_line, regex: 'new-netfirewallrule\s.{0,160}-direction\s+inbound.{0,160}-action\s+allow(?!.{0,120}-program)'}
      - {field: command_line, regex: 'netsh(\.exe)?\s+(advfirewall\s+firewall|firewall)\s+(add\s+(rule|portopening|allowedprogram)|set\s+opmode).{0,160}(localport=(4444|1337|31337|9001|8081|5555|6666)|name="?(core networking|windows update|microsoft)\b)'}
  tests:
    - {event: {command_line: 'netsh advfirewall firewall add rule name="Core Networking" dir=in action=allow protocol=TCP localport=4444'}, expect_match: true}
    - {event: {command_line: 'netsh advfirewall firewall add rule name="App HTTPS" dir=in action=allow protocol=TCP localport=8443 program="C:\Program Files\App\app.exe"'}, expect_match: false}
    - {event: {command_line: 'netsh advfirewall firewall show rule name=all'}, expect_match: false}

- id: TB-EVADE-003
  name: Masquerading system process running from an unexpected path
  severity: high
  confidence: 75
  techniques: [T1036]
  tags: [masquerading, defense-evasion]
  match:
    all:
      - {field: process_name, regex: '^(svchost|lsass|csrss|winlogon|services|smss|wininit|spoolsv|taskhost\w{0,3}|dllhost|conhost)\.exe$'}
      - {field: raw.process_path, regex: '.{3,}'}
      - not: {field: raw.process_path, regex: '^(c:\\windows\\(system32|syswow64|winsxs)\\|\\systemroot\\system32\\|\\windows\\system32\\)'}
  tests:
    - {event: {process_name: svchost.exe, raw_data: {process_path: 'C:\Users\Public\svchost.exe'}}, expect_match: true}
    - {event: {process_name: svchost.exe, raw_data: {process_path: 'C:\Windows\System32\svchost.exe'}}, expect_match: false}

- id: TB-EVADE-004
  name: Process injection or reflective loading indicators
  severity: high
  confidence: 70
  techniques: [T1055, T1620]
  tags: [injection, defense-evasion]
  match:
    any:
      - {field: text, regex: '\b(createremotethread|ntcreatethreadex|queueuserapc|writeprocessmemory|virtualallocex|setthreadcontext|process hollowing|reflective dll)\b'}
      - {field: raw.event_code, in: ['8']}
      - {field: text, regex: 'invoke-(reflectivepeinjection|dllinjection|processhollow)|donut\.exe|shellcode inject'}
  tests:
    - {event: {title: 'CreateRemoteThread into explorer.exe'}, expect_match: true}
    - {event: {title: 'Remote thread created'}, expect_match: false}

- id: TB-EVADE-005
  name: Indicator removal or timestomping of tools
  severity: medium
  confidence: 60
  techniques: [T1070.004, T1070]
  tags: [defense-evasion, anti-forensics]
  match:
    any:
      - {field: command_line, regex: '(shred|sdelete(64)?(\.exe)?|cipher\s+/w:)\s.{0,60}(/tmp|\\temp|\\users|\.exe|\.sh|\.ps1)'}
      - {field: command_line, regex: 'touch\s+-(r|d|t)\s+\S{1,60}\s+/(tmp|var|usr|dev/shm)/\S{1,60}'}
      - {field: command_line, regex: 'timestomp|setmace|\(get-item\s.{0,40}\)\.(creation|lastwrite)time\s?='}
  tests:
    - {event: {command_line: 'sdelete64.exe -p 3 C:\Users\Public\payload.exe'}, expect_match: true}
    - {event: {command_line: 'rm -f /tmp/build.log'}, expect_match: false}

- id: TB-EVADE-006
  name: Log source stopped or monitoring agent tampered with
  severity: high
  confidence: 70
  techniques: [T1562.006, T1562.001]
  tags: [defense-evasion, telemetry-gap]
  match:
    any:
      - {field: event_type, regex: '^((agent|logging|sensor)\.|system\.log_source[._])(stopped|disconnected|silent|tamper|disabled|uninstalled)'}
      - {field: text, regex: '(audit daemon (is )?(exiting|stopped)|auditd.{0,20}stopp|sysmon (service|driver).{0,20}(stopped|unloaded)|edr (sensor|agent) (tamper|uninstall|stopp)|wazuh agent.{0,20}(stopped|disconnected unexpectedly)|rsyslogd.{0,20}exiting)'}
  tests:
    - {event: {event_type: agent.stopped}, expect_match: true}
    - {event: {event_type: system.log_source_silent}, expect_match: true}
    - {event: {title: 'Sysmon service state changed: Stopped'}, expect_match: true}
    - {event: {title: 'Sysmon service state changed: Running'}, expect_match: false}

- id: TB-CLOUD-002
  name: Cloud audit logging, detection or flow logging disabled
  severity: high
  confidence: 85
  techniques: [T1562.008]
  tags: [cloud, defense-evasion]
  match:
    any:
      - {field: raw.eventName, in: [StopLogging, DeleteTrail, UpdateTrail, PutEventSelectors, DeleteFlowLogs, DeleteDetector, StopConfigurationRecorder, DeleteConfigurationRecorder, DisableSecurityHub, DeleteLogGroup, DeleteLogStream, DisableAlarmActions, DeleteMemberAccounts, UpdateDetector, DeleteSink, DeleteLogging]}
      - {field: event_type, regex: 'cloudtrail.{0,10}(stop|delete|disabled)|cloud\.(logging|audit)\.disabled'}
      - {field: raw.operationName, regex: '(microsoft\.insights/diagnosticsettings/delete|microsoft\.security/securitycontacts/delete|microsoft\.operationalinsights/workspaces/delete)'}
      - {field: raw.methodName, regex: '(google\.logging\.v2\.configservicev2\.(deletesink|updatesink)|logging\.sinks\.(delete|update))'}
      - {field: command_line, regex: 'aws\s+cloudtrail\s+(stop-logging|delete-trail|update-trail|put-event-selectors)|aws\s+guardduty\s+(delete-detector|update-detector.{0,40}--no-enable)|aws\s+configservice\s+(stop-configuration-recorder|delete-configuration-recorder)|aws\s+ec2\s+delete-flow-logs|gcloud\s+logging\s+sinks\s+delete|az\s+monitor\s+diagnostic-settings\s+delete'}
  tests:
