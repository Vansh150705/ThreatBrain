      - {field: command_line, regex: '\b(nc|ncat|netcat)(\.exe|\.traditional)?\s.{0,60}\s-[a-z]*e\s'}
      - {field: command_line, regex: 'bash\s+-i\s{0,3}>&?\s{0,3}/dev/tcp'}
      - {field: command_line, regex: '(python\d?|perl|ruby|php|lua)\s+-[a-z]\s.{0,200}(socket|fsockopen|TCPSocket|IO\.popen).{0,200}(/bin/(ba)?sh|cmd|exec|dup2|subprocess|spawn|pty)'}
      - {field: command_line, regex: 'mkfifo\s+\S{1,40}.{0,60}(nc|ncat|netcat|/bin/sh|telnet)'}
