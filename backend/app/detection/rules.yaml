    - {event: {raw_data: {eventName: DeleteDetector}}, expect_match: true}
    - {event: {raw_data: {operationName: 'MICROSOFT.INSIGHTS/DIAGNOSTICSETTINGS/DELETE'}}, expect_match: true}
    - {event: {command_line: 'aws cloudtrail stop-logging --name org-trail'}, expect_match: true}
    - {event: {command_line: 'aws cloudtrail describe-trails'}, expect_match: false}
    - {event: {raw_data: {eventName: DescribeTrails}}, expect_match: false}

# =============================================================== CLOUD IDENTITY & CONFIGURATION
- id: TB-CLOUD-001
  name: Storage made publicly accessible or ACL/policy opened to everyone
  severity: high
  confidence: 80
  techniques: [T1530]
  tags: [cloud, storage, public-exposure]
  match:
    any:
      - {field: event_type, regex: 'bucket.{0,20}public|public.{0,20}bucket|s3.{0,20}public|storage.{0,20}public'}
      - all:
          - {field: raw.eventName, in: [PutBucketAcl, PutBucketPolicy, PutObjectAcl, DeleteBucketPublicAccessBlock, PutBucketPublicAccessBlock]}
          - {field: text, regex: '(allusers|authenticatedusers|"principal":\s*"\*"|"principal":\s*\{\s*"aws":\s*"\*"|blockpublicacls.{0,6}false|restrictpublicbuckets.{0,6}false)'}
      - {field: raw.eventName, equals: DeleteBucketPublicAccessBlock}
      - {field: raw.methodName, regex: 'storage\.(buckets|objects)\.setiampolicy', }
  tests:
    - {event: {raw_data: {eventName: PutBucketAcl, requestParameters: {AccessControlPolicy: {grant: 'AllUsers READ'}}}}, expect_match: true}
    - {event: {raw_data: {eventName: DeleteBucketPublicAccessBlock}}, expect_match: true}
    - {event: {raw_data: {eventName: PutBucketAcl, requestParameters: {grant: 'CanonicalUser'}}}, expect_match: false}

- id: TB-CLOUD-003
  name: Administrator privileges, access keys or login profile granted in the cloud
  severity: high
  confidence: 75
  techniques: [T1098.003, T1098.001, T1078.004]
  tags: [cloud, iam, privilege-escalation]
  tuning: Expected from your IaC pipeline principal; exclude that identity.
  match:
    any:
      - all:
          - {field: raw.eventName, in: [AttachUserPolicy, AttachRolePolicy, PutUserPolicy, PutRolePolicy, AttachGroupPolicy, CreatePolicyVersion, SetDefaultPolicyVersion]}
          - {field: text, regex: '(AdministratorAccess|"Action":\s*"\*"|iam:\*|PowerUserAccess|:policy/IAMFullAccess)'}
      - {field: raw.eventName, in: [CreateLoginProfile, UpdateLoginProfile, UpdateAssumeRolePolicy]}
      - {field: command_line, regex: 'aws\s+iam\s+(create-login-profile|update-login-profile|update-assume-role-policy|put-(user|role|group)-policy|create-access-key\s.{0,40}--user-name|attach-(user|role|group)-policy\s.{0,120}(administratoraccess|iamfullaccess|poweruseraccess))'}
      - all:
          - {field: raw.eventName, equals: CreateAccessKey}
          - {field: raw.requestParameters.userName, regex: '.{1,}'}
          - not: {field: raw.requestParameters.userName, equals: ''}
  tests:
    - {event: {raw_data: {eventName: AttachUserPolicy, requestParameters: {policyArn: 'arn:aws:iam::aws:policy/AdministratorAccess'}}}, expect_match: true}
    - {event: {raw_data: {eventName: CreateLoginProfile}}, expect_match: true}
    - {event: {command_line: 'aws iam create-access-key --user-name backup-admin'}, expect_match: true}
    - {event: {command_line: 'aws iam list-users'}, expect_match: false}
    - {event: {raw_data: {eventName: AttachUserPolicy, requestParameters: {policyArn: 'arn:aws:iam::aws:policy/ReadOnlyAccess'}}}, expect_match: false}

- id: TB-CLOUD-010
  name: Multi-factor authentication removed or weakened for an account or tenant
  severity: high
  confidence: 80
  techniques: [T1556, T1098]
  tags: [cloud, identity, mfa]
  tuning: Offboarding and device replacement legitimately deactivate devices; correlate with a ticket.
  match:
    any:
      - {field: raw.eventName, in: [DeactivateMFADevice, DeleteVirtualMFADevice, DisableOrganizationAdminAccount]}
      - {field: command_line, regex: 'aws\s+iam\s+(deactivate-mfa-device|delete-virtual-mfa-device)\b'}
      - all:
          - {field: event_type, regex: '^identity\.'}
          - {field: text, regex: '(mfa|multi-?factor|authenticator).{0,60}(disabled|removed|unenrolled|bypass|enforcement:\s*disabled|deactivat)|(disabled|removed|deactivat).{0,60}(mfa|multi-?factor)'}
  tests:
    - {event: {raw_data: {eventName: DeactivateMFADevice, eventSource: iam.amazonaws.com}}, expect_match: true}
    - {event: {event_type: identity.okta, raw_data: {eventType: policy.rule.update, change: 'MFA enforcement: DISABLED'}}, expect_match: true}
    - {event: {raw_data: {eventName: EnableMFADevice, eventSource: iam.amazonaws.com}}, expect_match: false}
    - {event: {event_type: identity.mfa_enroll, raw_data: {detail: authenticator app enrolled}}, expect_match: false}

- id: TB-CLOUD-004
  name: Cloud root / owner account used
  severity: high
