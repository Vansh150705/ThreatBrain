    command_line: Add-Type -TypeDefinition @' using System; using System.Runtime.InteropServices; [StructLayout(LayoutKind.Sequential)] public struct MIB_IPADDRTABLE {     public uint dwNumEntries;     public
      MIB_IPADDRROW table;  // first row only } [StructLayout(LayoutKind.Sequential)] public struct MIB_IPADDRROW {     public uint dwAddr;     public uint dwIndex;     public uint dwMask;     public uint
      dwBCastAddr;     public uint dwReasmSize;     public ushort unused1;     public ushort wType; } public class IpEnumeration{ [DllImport("iphlpapi.dll", SetLastError = true)] static extern uint GetIpAddrTable(IntPtr
      pIpAddrTable, ref int pdwSize, bool bOrder); public static void getIPs(){   int size = 0;   GetIpAddrTable(IntPtr.Zero, ref size, false);   IntPtr buffer = Marshal.AllocHGlobal(size);   try {       GetIpAddrTable(buffer,
      ref size, false);       var table = Marshal.PtrToStructure<MIB_IPADDRTABLE>(buffer);       int rowSize = Marshal.SizeOf<MIB_IPADDRROW>();       for (int i = 0; i < table.dwNumEntries; i++){           IntPtr
      rowPtr = buffer + 4 + (i * rowSize);           var row = Marshal.PtrToStructure<MIB_IPADDRROW>(rowPtr);           Console.WriteLine(new System.Net.IPAddress(row.dwAddr));       }   } finally {       Marshal.FreeHGlobal(buffer);   }
      } } '@ [IpEnumeration]::getIPs()
