- id: ART-T1082-04
  name: Linux VM Check via Hardware
  techniques:
  - T1082
  tactic: TA0007
  platform: linux
  art_guid: 31dad7ad-2286-4c02-ae92-274418c85fec
  split: tuning
  events:
  - title: Process creation
    event_type: process.start
    asset_name: atomic-lin-01
    process_name: bash
    command_line: if [ -f /sys/class/dmi/id/bios_version ]; then cat /sys/class/dmi/id/bios_version | grep -i amazon; fi; if [ -f /sys/class/dmi/id/product_name ]; then cat /sys/class/dmi/id/product_name
      | grep -i "Droplet\|HVM\|VirtualBox\|VMware"; fi; if [ -f /sys/class/dmi/id/chassis_vendor ]; then cat /sys/class/dmi/id/chassis_vendor | grep -i "Xen\|Bochs\|QEMU"; fi; if [ -x "$(command -v dmidecode)"
      ]; then sudo dmidecode | grep -i "microsoft\|vmware\|virtualbox\|quemu\|domu"; fi; if [ -f /proc/scsi/scsi ]; then cat /proc/scsi/scsi | grep -i "vmware\|vbox"; fi; if [ -f /proc/ide/hd0/model ];
      then cat /proc/ide/hd0/model | grep -i "vmware\|vbox\|qemu\|virtual"; fi; if [ -x "$(command -v lspci)" ]; then sudo lspci | grep -i "vmware\|virtualbox"; fi; if [ -x "$(command -v lscpu)" ]; then
      sudo lscpu | grep -i "Xen\|KVM\|Microsoft"; fi
