      $credFile         }         exit $errCode     }     Write-Host -ForegroundColor Cyan "Successfully changed the password to onlyUPandLowChars"     $newCred = New-Object System.Management.Automation.PSCredential
      ($env:USERNAME, $(ConvertTo-SecureString "onlyUPandLowChars" -AsPlainText -Force))     $newCred.Password | ConvertFrom-SecureString | Out-File $credFile } else {     Write-Host -ForegroundColor Yellow
