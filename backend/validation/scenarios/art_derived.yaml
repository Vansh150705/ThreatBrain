- id: ART-T1083-09
  name: Recursive Enumerate Files And Directories By Powershell
  techniques:
  - T1083
  tactic: TA0007
  platform: windows
  art_guid: 95a21323-770d-434c-80cd-6f6fbf7af432
  split: blind
  events:
  - title: Process creation
    event_type: process.start
    asset_name: atomic-win-01
    process_name: powershell.exe
    command_line: '$out = "$env:TEMP\T1083-Enumerate-net.txt" $dirsFilter = @(''Documents'',''Downloads'',''Desktop'',''OneDrive'') $exts = @(''.pdf'',''.doc'',''.docx'',''.xls'',''.xlsx'',''.txt'',''.zip'',''.rar'',''.7z'')
      $userProfile = [Environment]::GetFolderPath(''UserProfile'') $tr = [System.Collections.Generic.List[string]]::new() function MatchesExtension($path) {   try {     $e = [System.IO.Path]::GetExtension($path).ToLower()     return
      $exts -contains $e   } catch { return $false } } function Scan-Dir($root) {   try {     $match = $false     foreach ($f in $dirsFilter) { if ($root -like "*$f*") { $match = $true; break } }     if
      (-not $match) { return }     [System.IO.Directory]::EnumerateFiles($root) | ForEach-Object {       if (MatchesExtension $_) {         $fi = [System.IO.FileInfo]::new($_)         $tr.Add("[File] $_
      Size:$($fi.Length) LastWrite:$($fi.LastWriteTime)")       }     }     [System.IO.Directory]::EnumerateDirectories($root) | ForEach-Object {       Scan-Dir $_     }   } catch [System.UnauthorizedAccessException]
      {     $tr.Add("[AccessDenied] $root")   } catch {     $tr.Add("[Error] $root => $($_.Exception.Message)")   } } [System.IO.Directory]::EnumerateDirectories($userProfile) | ForEach-Object { Scan-Dir
      $_ } $outDir = [System.IO.Path]::GetDirectoryName($out) if (-not [string]::IsNullOrEmpty($outDir) -and -not (Test-Path $outDir)) {   New-Item -Path $outDir -ItemType Directory -Force | Out-Null }
      $tr | Out-File -FilePath $out -Encoding UTF8 Write-Output "Enumeration complete. Results written to: $out"'
