  tactic: TA0003
  platform: windows
  art_guid: fc5f9414-bd67-4f5f-a08e-e5381e29cbd1
  split: blind
  events:
  - title: Process creation
    event_type: process.start
    asset_name: atomic-win-01
    process_name: powershell.exe
    command_line: '$credFile = "$env:LOCALAPPDATA\AtomicRedTeam\$env:USERNAME.txt" if (Test-Path $credFile) {     $cred = New-Object -TypeName System.Management.Automation.PSCredential -ArgumentList $env:USERNAME,
      (Get-Content $credFile | ConvertTo-SecureString)     if($cred.GetNetworkCredential().Password -eq "Uplow-1"){       Write-Host -ForegroundColor Yellow "The new password is the same as the password
      stored in the credential file. Please specify a different new password."; exit -1     }     try {         $newPassword = ConvertTo-SecureString Uplow-1 -AsPlainText -Force         Set-ADAccountPassword
      -Identity $env:USERNAME -OldPassword $cred.password -NewPassword $newPassword     }     catch {         $_.Exception         $errCode = $_.Exception.ErrorCode         Write-Host "Error code: $errCode"         if
      ($errCode -eq 86) {             Write-Host -ForegroundColor Yellow "The stored password for the current user is incorrect. Please run the prereq commands to set the correct credentials"             Remove-Item
      $credFile         }         exit $errCode     }     Write-Host -ForegroundColor Cyan "Successfully changed the password to Uplow-1"     $newCred = New-Object System.Management.Automation.PSCredential
      ($env:USERNAME, $(ConvertTo-SecureString "Uplow-1" -AsPlainText -Force))     $newCred.Password | ConvertFrom-SecureString | Out-File $credFile } else {     Write-Host -ForegroundColor Yellow "You
      must store the password of the current user by running the prerequisite commands first" }'
