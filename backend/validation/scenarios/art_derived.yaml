- id: ART-T1046-10
  name: Port-Scanning /24 Subnet with PowerShell
  techniques:
  - T1046
  tactic: TA0007
  platform: windows
  art_guid: 05df2a79-dba6-4088-a804-9ca0802ca8e4
  split: blind
  events:
  - title: Process creation
    event_type: process.start
    asset_name: atomic-win-01
    process_name: powershell.exe
    command_line: '$ipAddr = "" if ($ipAddr -like "*,*") {     $ip_list = $ipAddr -split ","     $ip_list = $ip_list.ForEach({ $_.Trim() })     Write-Host "[i] IP Address List: $ip_list"     $ports = 445,
      3389     foreach ($ip in $ip_list) {         foreach ($port in $ports) {             Write-Host "[i] Establishing connection to: $ip : $port"             try {                 $tcp = New-Object Net.Sockets.TcpClient                 $tcp.ConnectAsync($ip,
      $port).Wait(200) | Out-Null             } catch {}             if ($tcp.Connected) {                 $tcp.Close()                 Write-Host "Port $port is open on $ip"             }         }     }
      } elseif ($ipAddr -notlike "*,*") {     if ($ipAddr -eq "") {         $interface = Get-NetIPInterface -AddressFamily IPv4 -ConnectionState Connected | Select-Object -ExpandProperty InterfaceAlias
      -First 1         Write-Host "[i] Using Interface $interface"         $ipAddr = Get-NetIPAddress -AddressFamily IPv4 -InterfaceAlias $interface | Select-Object -ExpandProperty IPAddress     }     Write-Host
      "[i] Base IP-Address for Subnet: $ipAddr"     $subnetSubstring = $ipAddr.Substring(0, $ipAddr.LastIndexOf(''.'') + 1)     Write-Host "[i] Assuming /24 subnet. scanning $subnetSubstring''1'' to $subnetSubstring''254''"     $ports
      = 445, 3389     $subnetIPs = 1..254 | ForEach-Object { "$subnetSubstring$_" }     foreach ($ip in $subnetIPs) {         foreach ($port in $ports) {             try {                 $tcp = New-Object
      Net.Sockets.TcpClient                 $tcp.ConnectAsync($ip, $port).Wait(200) | Out-Null             } catch {}             if ($tcp.Connected) {                 $tcp.Close()                 Write-Host
      "Port $port is open on $ip"             }         }     } } else {     Write-Host "[Error] Invalid Inputs"     exit 1 }'
