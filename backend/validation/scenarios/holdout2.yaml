# Held-out round 2 (written after round-1 remediation; first-run score recorded in reports/history.md).
# Events marked `adapter:` carry a *vendor-shaped payload* that goes through the real ingest adapter and
# normalisation first, so this round also tests the parsing layer, not only the rules.
scenarios:
- {id: HL2-001, name: Wazuh sysmon - encoded PowerShell with full image path, techniques: [T1059.001], tactic: TA0002, events: [{adapter: wazuh, payload: {timestamp: "2026-01-01T10:00:00.000+0000", rule: {id: "92027", level: 12, description: "Sysmon process creation", groups: [sysmon, windows]}, agent: {name: WS-FIN-04}, data: {win: {system: {eventID: "1"}, eventdata: {image: "C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe", commandLine: "powershell.exe -nop -w hidden -enc SQBFAFgAIAAoAE4AZQB3AC0ATwBiAGoAZQBjAHQAIABOAGUAdAAuAFcAZQBiAEMAbABpAGUAbgB0ACkA", parentImage: "C:\\Program Files\\Microsoft Office\\root\\Office16\\WINWORD.EXE"}}}}}]}
