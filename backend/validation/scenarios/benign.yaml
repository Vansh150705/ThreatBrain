# Benign "hard negatives": legitimate activity that shares vocabulary, tools or structure with attacks.
# A SOC does not want an alert for any of these. A rule that fires here is a false positive to be
# tuned or documented, never hidden.
scenarios:
- {id: BEN-001, name: Admin lists scheduled tasks, events: [{title: Process creation, event_type: process.start, command_line: "schtasks /query /fo LIST"}]}
- {id: BEN-002, name: Admin queries a single local user, events: [{title: Process creation, event_type: process.start, command_line: "net user alice"}]}
- {id: BEN-003, name: Mapping a file share, events: [{title: Process creation, event_type: process.start, command_line: "net use Z: \\\\fileserver\\public /persistent:no"}]}
- {id: BEN-004, name: Backup script via PowerShell file, events: [{title: Process creation, event_type: process.start, process_name: powershell.exe, command_line: "powershell.exe -NoProfile -File C:\\scripts\\nightly-backup.ps1"}]}
- {id: BEN-005, name: Download a web page with curl, events: [{title: Process creation, event_type: process.start, command_line: "curl -sS -o /tmp/index.html https://example.org/"}]}
- {id: BEN-006, name: Developer pulls with git over ssh, events: [{title: Process creation, event_type: process.start, command_line: "git pull origin main"}]}
- {id: BEN-007, name: Normal ssh login, events: [{title: Process creation, event_type: process.start, command_line: "ssh deploy@10.0.0.5 uptime"}]}
