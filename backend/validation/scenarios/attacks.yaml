# Attack scenarios: synthetic telemetry modelled on public adversary-emulation procedures
# (Atomic Red Team style). NOTHING here is executed; each scenario is only event data.
# Titles are deliberately neutral (as in real process/audit telemetry), so detection must come
# from the behaviour, not from a title that names the attack.
