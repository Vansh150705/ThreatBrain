# Dataset registry. Every scenario belongs to exactly ONE split and results are never pooled across splits.
#   development  used while writing rules/thresholds (tuning allowed; regression guard)
#   tuning       consumed held-out rounds + the tuning half of Atomic Red Team (tuning allowed; separate numbers)
#   heldout      FROZEN before evaluation (validation/FROZEN.json). No tuning. Reported as aggregates only; the runner
#                writes per-scenario detail to a separate file that is not linked from any report.
splits:
  development: {tuning_allowed: true, frozen: false}
  tuning: {tuning_allowed: true, frozen: false}
  heldout: {tuning_allowed: false, frozen: true}
sources:
  # --- development
  - {file: attacks.yaml, split: development, role: attack, prefix: ATK-}
  - {file: benign.yaml, split: development, role: benign, prefix: BEN-}
  - {file: chains.yaml, split: development, role: chain}
  - {file: chains_negative.yaml, split: development, role: chain}
  - {file: behavior_dev.yaml, split: development, role: behavior}
  # --- tuning (were independent held-out sets in earlier rounds; their misses were used to improve rules)
  - {file: holdout.yaml, split: tuning, role: attack, prefix: HLD-}
  - {file: holdout.yaml, split: tuning, role: benign, prefix: HLB-}
  - {file: holdout2.yaml, split: tuning, role: attack, prefix: HL2-}
  - {file: holdout2.yaml, split: tuning, role: benign, prefix: HB2-}
  - {file: evasion.yaml, split: tuning, role: attack}
  - {file: art_derived.yaml, split: tuning, role: attack, art_split: tuning}
  - {file: external/lolbas_derived.yaml, split: tuning, role: attack, art_split: tuning, optional: true}
  # --- consumed held-out v3 (frozen by hash, but its per-scenario detail was used to remediate: now a TUNING set)
  - {file: heldout_v3.yaml, split: tuning, role: attack, prefix: HO3-}
  - {file: heldout_v3.yaml, split: tuning, role: benign, prefix: HB3-}
  - {file: heldout_v3_chains.yaml, split: tuning, role: chain}
  - {file: adversarial_unseen.yaml, split: tuning, role: adversarial}
  - {file: behavior_heldout.yaml, split: tuning, role: behavior}
  # --- held-out (frozen, never inspected at scenario level)
  - {file: heldout_v4.yaml, split: heldout, role: attack, prefix: HO4-}
  - {file: heldout_v4.yaml, split: heldout, role: benign, prefix: HB4-}
  - {file: heldout_v4_chains.yaml, split: heldout, role: chain}
  - {file: behavior_heldout_v4.yaml, split: heldout, role: behavior}
  - {file: art_derived.yaml, split: heldout, role: attack, art_split: blind}
  - {file: external/lolbas_derived.yaml, split: heldout, role: attack, art_split: blind, optional: true}
# Tactics whose techniques leave a command-line/behaviour trace that a detection product is expected to alert on.
# Discovery/Collection/Reconnaissance commands (whoami, ipconfig, dir) are indistinguishable from administration without
# context, so they are reported separately and NOT part of the gated recall. Fixed before the held-out run.
high_signal_tactics: [TA0001, TA0002, TA0003, TA0004, TA0005, TA0006, TA0008, TA0010, TA0011, TA0040]
