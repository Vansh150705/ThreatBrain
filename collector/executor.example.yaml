# Copy to executor.yaml and fill in. Then: chmod 600 executor.yaml
base_url: https://vansh150705-threatbrain-backend.hf.space/api/v1
email: you@example.com
password: your-threatbrain-password
poll_interval: 10
# dry_run: true logs intended blocks without touching iptables.
# Set false to really add iptables DROP rules (needs root).
dry_run: true
# firewall: auto picks iptables on Linux and Windows Firewall on Windows.
# Force it with "iptables" or "windows" if you prefer.
firewall: auto
# allow_private: block private/LAN IPs too. Keep false in production; set true in
# a LAN lab where the attacker box is on a private IP (e.g. 192.168.x / 10.x).
allow_private: false
# Which real actions this executor may carry out. block_ip is safe + reversible.
# Add disable_user to also lock compromised accounts (Linux usermod -L /
# Windows net user /active:no). root/admin and the names below are never touched.
enabled_actions:
  - block_ip
  # - disable_user
# Never block these IPs (your own IP / management hosts):
allowlist:
  - 203.0.113.9
# Never disable these accounts (extra protection on top of root/admin):
user_allowlist:
  - youradminuser
